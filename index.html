const HUD_H=Math.round(40*K), MSG_H=0, BTN_H=Math.round(26*K);
const CTRL_MIN=Math.round(104*K), CTRL_MAX=Math.round(340*K);
const GAP_MAX=Math.round(24*K);  /* respiration maximale sous l'en-tete */
let CTRL_H=150, TOTH=0, BOARD_Y=HUD_H, MSG_Y=0, CTRL_Y=0, BTN_Y=0;
const HUD_Y=TITRE_H;                 /* l'en-tete des scores commence sous le titre */
let GAP_B=0;                  /* de combien le plateau descend sous l'en-tete */
let PAD_H=Math.round(96*K);   /* hauteur du pave, reglette comprise */
let PAD_Y=0;                  /* haut du pave */
let TRK_H=Math.round(34*K);   /* bandeau de la reglette, en haut du pave */
let JOY_H=0;                  /* etage du jeton, sous la reglette */
let MENU_H=0;                 /* hauteur offerte aux pages de menu */
const JOY={cx:BUF/2, cy:0, r:Math.round(44*K), kx:0, ky:0};
const TRK={x0:0, x1:0, y:0, h:Math.round(12*K)};
const PWR={y:0};   /* frontiere entre la reglette de placement et le pave */
/* Zone reellement disponible : la fenetre moins les marges de securite.
   On lit le remplissage effectif du corps, deja calcule par le navigateur a
   partir des env(safe-area-inset-*) : c'est du px resolu, pas une formule. */
function vpW(){
  const s=getComputedStyle(document.body);
  const n=v=>{const p=parseFloat(v); return isFinite(p)?p:0;};
  return Math.max(1, window.innerWidth-n(s.paddingLeft)-n(s.paddingRight));
}
function vpH(){
  const s=getComputedStyle(document.body);
  const n=v=>{const p=parseFloat(v); return isFinite(p)?p:0;};
  return Math.max(1, window.innerHeight-n(s.paddingTop)-n(s.paddingBottom));
}
function metrics(){
  const vw=vpW(), vh=vpH();
  const want=Math.round(BUF*vh/vw)-TITRE_H-HUD_H-BW-MSG_H-BTN_H;
  const reste=Math.max(CTRL_MIN,Math.min(CTRL_MAX+GAP_MAX,want));
  /* le plateau se decolle de l'en-tete des qu'il y a de quoi */
  GAP_B=Math.max(0,Math.min(GAP_MAX,reste-CTRL_MIN));
  CTRL_H=reste-GAP_B;
  TOTH=TITRE_H+HUD_H+GAP_B+BW+MSG_H+CTRL_H+BTN_H;
  BOARD_Y=TITRE_H+HUD_H+GAP_B; MSG_Y=BOARD_Y+BW; CTRL_Y=MSG_Y+MSG_H; BTN_Y=CTRL_Y+CTRL_H;
  /* un seul pave : la reglette de placement en bandeau haut, le jeton dessous.
     Les deux gestes du tir tiennent ainsi sous le meme pouce. */
  const marge=R(8*K);
  PAD_H=Math.max(R(80*K),Math.min(R(170*K),CTRL_H-2*marge));
  PAD_Y=CTRL_Y+Math.floor((CTRL_H-PAD_H)/2);
  TRK_H=Math.min(R(34*K),Math.floor(PAD_H*0.32));
  const cote=R(12*K), LP=BUF-2*cote;
  TRK.x0=cote+R(16*K); TRK.x1=cote+LP-R(16*K);
  TRK.y=PAD_Y+Math.floor(TRK_H/2);
  PWR.y=PAD_Y+TRK_H;                       /* frontiere reglette / jeton */
  /* le jeton demarre franchement sous le bandeau, d'ou le retrait */
  const retrait=Math.min(R(14*K),Math.floor((PAD_H-TRK_H)*0.12));
  JOY_H=Math.max(R(40*K),PAD_H-TRK_H-retrait);
  JOY.cy=PAD_Y+TRK_H+retrait+Math.floor(JOY_H/2);
  MENU_H=BW+CTRL_H+BTN_H;   /* du haut du plateau au bas de l'ecran */
}

const ACC={'È':'E','Ê':'E','À':'A','Â':'A','Ç':'C','Î':'I','Ô':'O','Û':'U','Ù':'U'};
/* E accentue : l'accent occupe la premiere ligne, le E est ramene sur huit */
FS['É']='00110,11111,10000,10000,11110,10000,10000,10000,11111';
const GS={};
for(const k in FS) GS[k]=FS[k].split(',');
function norm(t,set){
  t=String(t).toUpperCase(); let o='';
  for(const ch of t) o += (ACC[ch]||(set[ch]?ch:' '));
  return o;
}
/* petite police */
const GW=5, GH=9, GT=1;            /* chasse, hauteur, approche */
/* police 3x5 pour la marque imprimee sur le tapis, qui doit tenir entre les traits */
const PETIT={
  K:['10010','10100','11000','11000','10100','10010','10010'],
  A:['01100','10010','10010','11110','10010','10010','10010'],
  R:['11100','10010','10010','11100','10100','10010','10010'],
  O:['01100','10010','10010','10010','10010','10010','01100'],
  M:['10001','11011','10101','10101','10001','10001','10001']
};
const PW=5, PH=7, PT=1;
function pw(t){ const n=String(t).length; return n?n*(PW+PT)-PT:0; }
function ptext(g,t,x,y,col){
  g.fillStyle=col;
  let cx=x;
  for(const c of String(t)){
    const gl=PETIT[c];
    if(gl) for(let r=0;r<PH;r++) for(let k=0;k<PW;k++)
      if(gl[r][k]==='1') g.fillRect(cx+k,y+r,1,1);
    cx+=PW+PT;
  }
}
function sw(t){ const n=norm(t,GS).length; return n?n*(GW+GT)-GT:0; }
function stext(g,t,x,y,col){
  t=norm(t,GS); g.fillStyle=col;
  for(let i=0;i<t.length;i++){ const gl=GS[t[i]]; if(!gl) continue;
    for(let r=0;r<GH;r++) for(let c=0;c<GW;c++) if(gl[r][c]==='1') g.fillRect(x+i*(GW+GT)+c,y+r,1,1); }
}
function stextC(g,t,cx,y,col){ stext(g,t,Math.round(cx-sw(t)/2),y,col); }

/* display : masque + contour + ombre + éclat */
function bw(t,sc){ sc=sc||1; const n=norm(t,GS).length; return n?n*(GW+GT)*sc-GT*sc:0; }
function btext(g,t,x,y,col,sc){
  sc=sc||1; t=norm(t,GS);
  const put=(px,py,c)=>{ g.fillStyle=c; g.fillRect(x+px*sc,y+py*sc,sc,sc); };
  for(let i=0;i<t.length;i++){ const gl=GS[t[i]]; if(!gl) continue;
    for(let r=0;r<GH;r++) for(let c=0;c<GW;c++) if(gl[r][c]==='1') put(i*(GW+GT)+c, r, col); }
  return bw(t,sc);
}
function btextC(g,t,cx,y,col,sc){ return btext(g,t,Math.round(cx-bw(t,sc)/2),y,col,sc); }

/* Hors partie l'en-tete des scores n'existe pas : la page remonte d'autant,
   sinon le bandeau du titre laisserait un trou a sa place. Le dessin et le
   pointage lisent tous les deux cette valeur, ils ne peuvent pas diverger. */
function hautPage(){ return phase==='menu' ? BOARD_Y-HUD_H : BOARD_Y; }
/* Jersey : la grille n'est nette qu'aux corps multiples du pas */
const JF={j15:{step:27,cap:15,name:'Jersey15'}, j25:{step:41,cap:25,name:'Jersey25'}};
/* la taille demandee est quantifiee : voici celle qu'on obtient vraiment,
   exprimee en pixels de tampon, pour centrer juste */
function jcaps(capsBuf,fam){
  const f=JF[fam||'j15'];
  const m=Math.floor(capsBuf*KTX*DPR/f.cap);
  if(m<1) return capsBuf;        /* sous un carreau : voir jfit */
  return (f.cap*m/DPR)/KTX;
}
/* ordonnee du haut de capitale pour centrer un texte dans une boite */
function jmid(y,h,capsBuf,fam){ return y+Math.round((h-jcaps(capsBuf,fam))/2); }
function jfit(fam,capsCss){
  /* on quantifie sur la grille de l'ecran, pas sur celle du CSS :
     le carreau doit faire un nombre entier de pixels ecran */
  const f=JF[fam];
  const m=Math.floor(capsCss*DPR/f.cap);
  if(m<1){
    /* la taille demandee est plus petite qu'un carreau : quantifier la
       doublerait et le mot deborderait de son bouton. On perd le net,
       on garde la mesure. */
    tctx.font=(f.step*capsCss/f.cap)+'px '+f.name+',monospace';
    return capsCss;
  }
  tctx.font=(f.step*m/DPR)+'px '+f.name+',monospace';
  return f.cap*m/DPR;
}
/* coordonnees en pixels de tampon, hauteur de capitale idem */
/* ---- pixels durs, mais decroches de la grille du plateau ----
   une cellule = un pixel de jeu, cale sur la grille de l'ecran :
   le dessin reste blocs nets, la position avance trois fois plus finement */
let SHK={x:0,y:0};
let CELLD=3;
function majCell(){ CELLD=Math.max(1,Math.round(KTX*DPR)); }
function ptEcran(x,y){          /* px CSS -> px ecran, secousse et rotation comprises */
  let X=(x+SHK.x)*KTX*DPR, Y=(y+SHK.y)*KTX*DPR;
  if(rotT!==0){
    const cx=(BX+BW/2)*KTX*DPR, cy=(BOARD_Y+BW/2)*KTX*DPR;
    const c=Math.cos(rotT), s2=Math.sin(rotT), dx=X-cx, dy=Y-cy;
    X=cx+dx*c-dy*s2; Y=cy+dx*s2+dy*c;
  }
  return {x:Math.round(X), y:Math.round(Y)};
}
function ecranOuvre(){ tctx.save(); tctx.setTransform(1,0,0,1,0,0); }
function ecranFerme(){ tctx.restore(); }
function cellules(ox,oy,rayon,col,creux){
  const cd=CELLD, demi=Math.floor(cd/2);
  tctx.fillStyle=col;
  for(let dy=-rayon;dy<=rayon;dy++){
    const h=Math.floor(Math.sqrt(Math.max(0,rayon*rayon-dy*dy))+0.5);
    if(creux!==undefined){
      const hi=(Math.abs(dy)<=creux)?Math.floor(Math.sqrt(Math.max(0,creux*creux-dy*dy))+0.5):-1;
      if(hi>=0){
        tctx.fillRect(ox-h*cd-demi,     oy+dy*cd-demi,(h-hi)*cd, cd);
        tctx.fillRect(ox+(hi+1)*cd-demi,oy+dy*cd-demi,(h-hi)*cd, cd);
        continue;
      }
    }
    tctx.fillRect(ox-h*cd-demi, oy+dy*cd-demi, (2*h+1)*cd, cd);
  }
}
function discPix(d){
  const p=ptEcran(BX+d.x*S, BOARD_Y+d.y*S);
  const r=Math.max(2,Math.round(d.r*S));
  let body,edge;
  if(d.type==='S'){ body=P.sBody; edge=P.sEdge; }
  else if(d.type==='W'){ body=P.wPiece; edge=P.wEdge; }
  else if(d.type==='Q'){ body=P.qPiece; edge=P.qEdge; }
  else { body=P.bPiece; edge=P.bEdge; }
  const om=versLumiere(K,2*K);
  const o=ptEcran(BX+d.x*S+om.x, BOARD_Y+d.y*S+om.y);
  cellules(o.x,o.y,r+1,'rgba(24,14,4,.10)');
  cellules(o.x,o.y,r,'rgba(24,14,4,.22)');
  cellules(p.x,p.y,r,edge);
  cellules(p.x,p.y,r-1,body);
  if(d.type==='S') cellules(p.x,p.y,Math.max(1,r-2),P.sRed,Math.max(0,r-3));
}
function traitPix(ox,oy,ux,uy,rad,col,pas){
  let end=1400;
  for(let t=rad+6;t<1400;t+=5){
    const x=ox+ux*t, y=oy+uy*t;
    if(x<MINX+rad||x>MAXX-rad||y<MINY+rad||y>MAXY-rad){ end=t; break; }
    let stop=false;
    for(const d of discs){ if(!d.alive) continue; if(Math.hypot(d.x-x,d.y-y)<d.r+rad){ end=t; stop=true; break; } }
    if(stop) break;
  }
  tctx.fillStyle=col;
  const cd=CELLD, demi=Math.floor(cd/2);
  for(let t=rad+5;t<end;t+=pas){
    const p=ptEcran(BX+(ox+ux*t)*S, BOARD_Y+(oy+uy*t)*S);
    tctx.fillRect(p.x-demi,p.y-demi,cd,cd);
  }
  return end;
}
/* meme rasterisation pour les curseurs, qui ne sont ni sur le plateau ni tournes */
function pastillePix(xCss,yCss,rayon,col,creux){
  const p={x:Math.round(xCss*KTX*DPR), y:Math.round(yCss*KTX*DPR)};
  cellules(p.x,p.y,rayon,col,creux);
}
function normJ(t){ return String(t).toUpperCase(); }   /* Jersey sait ecrire les accents */
function jtext(t,bx,by,col,capsBuf,fam,align){
  t=normJ(t);
  const caps=jfit(fam||'j15',capsBuf*KTX);
  let x=bx*KTX;
  const w=tctx.measureText(t).width;
  if(align==='c') x-=w/2; else if(align==='r') x-=w;
  tctx.fillStyle=col;
  tctx.fillText(t, Math.round((x+TX*KTX)*DPR)/DPR, Math.round((by+TY)*KTX*DPR)/DPR+caps);
  return w/KTX;
}
function jw(t,capsBuf,fam){
  jfit(fam||'j15',capsBuf*KTX);
  return tctx.measureText(normJ(t)).width/KTX;
}

/* ===================== mise en page ===================== */
function layout(){
  metrics();
  const k=Math.min(vpW()/BUF, vpH()/TOTH);
  CSSW=Math.ceil(BUF*k); CSSH=Math.ceil(TOTH*k); KTX=CSSW/BUF;
  DPR=Math.max(1,Math.round(window.devicePixelRatio||1));
  cv.style.width=CSSW+'px'; cv.style.height=CSSH+'px';
  cv.width=BUF; cv.height=TOTH;
  ctx.imageSmoothingEnabled=false;
  tx.style.width=CSSW+'px'; tx.style.height=CSSH+'px';
  tx.width=Math.round(CSSW*DPR); tx.height=Math.round(CSSH*DPR);
  tctx.setTransform(DPR,0,0,DPR,0,0);
  tctx.textBaseline='alphabetic';
  majCell();
  draw();
}
function toCanvas(e){
  const r=cv.getBoundingClientRect();
  return {cx:(e.clientX-r.left)/r.width*BUF, cy:(e.clientY-r.top)/r.height*TOTH};
}
function toBoard(e){
  const c=toCanvas(e);
  let x=(c.cx-BX)/S, y=(c.cy-BOARD_Y)/S;
  if(flipped()){ x=W-x; y=W-y; }
  return {x,y};
}

function carrousel(){
  /* la carte s'allonge si le resume des regles tient sur plus d'une ligne :
     sa hauteur suit son contenu au lieu d'etre figee */
  const nRes=Math.max(1,resumeRegles().length);
  const px=R(26*K), pw=BW-2*px;
  const ph=R(104*K)+(nRes-1)*R(9*K)+GH+R(10*K);
  const h2=R(19*K), w2=Math.floor((pw-R(6*K))/2);
  const yTitre=R(8*K), hTitre=R(30*K);
  /* la carte du mode se pose vers le bas du plateau, sous le titre */
  const py=Math.max(yTitre+hTitre, BW-ph-R(20*K));
  /* le lancement et ses annexes occupent la bande sous le plateau,
     centres dedans : sur un ecran haut elle vaut le plateau entier */
  const sous=Math.max(R(80*K), hMenu()-BW);
  const hb=Math.max(R(26*K),Math.min(R(32*K),Math.floor(sous/9)));
  const ec=Math.max(R(8*K),Math.min(R(22*K),Math.floor(sous/12)));
  const ni=lignesInfo().length, hPuces=R(8*K), hInfo=ni*GH+(ni-1)*R(4*K);
  const bloc=hb+ec+h2+ec+hPuces+ec+hInfo;
  const yb=BW+Math.max(R(6*K),Math.floor((sous-bloc)/2));
  const y2=yb+hb+ec, yp=y2+h2+ec;
  return {
    titre:{y:yTitre},
    p:{x:px,y:py,w:pw,h:ph},
    gauche:{x:R(1*K), y:py+ph/2-R(24*K), w:R(24*K), h:R(48*K)},
    droite:{x:BW-R(25*K), y:py+ph/2-R(24*K), w:R(24*K), h:R(48*K)},
    start:{x:px,y:yb,w:pw,h:hb},
    regl:{x:px,y:y2,w:w2,h:h2},
    regles:{x:px+w2+R(6*K),y:y2,w:w2,h:h2},
    puces:{y:yp+Math.floor(hPuces/2)},
    info:{y:yp+hPuces+ec}
  };
}

function hMenu(){ return pause ? BW : MENU_H+HUD_H; }
function indexMode(){ const i=MODES.findIndex(m=>m.id===modeId); return i<0?0:i; }
function defiler(d){ chargerMode(MODES[(indexMode()+d+MODES.length)%MODES.length].id); }
function resumeRegles(){
  const L=[];
  if(cfg.but==='couleur') L.push(cfg.pions+' JETONS PAR CAMP');
  else if(cfg.but==='vider') L.push('VIDER LE PLATEAU');
  else if(!cfg.camps) L.push('UN JETON VAUT '+cfg.valeurs.W+' POINTS');
  else L.push('TOUS LES JETONS COMPTENT POUR LES DEUX');
  const b=[];
  if(cfg.but==='points'&&cfg.camps) b.push('NOIR '+cfg.valeurs.B+'  BLANC '+cfg.valeurs.W+(cfg.reine?'  REINE '+cfg.valeurs.Q:''));
  if(cfg.tirs)  b.push(cfg.tirs+' TIRS');

  if(cfg.cible) b.push('CIBLE '+cfg.cible);
  if(cfg.combo) b.push('COMBO X'+cfg.combo[cfg.combo.length-1]);
  if(cfg.reine) b.push(cfg.couvrir==='non'?'REINE LIBRE':'REINE A COUVRIR');
  if(cfg.etoiles) b.push('3 ETOILES A '+cfg.etoiles[0]);
  /* tout sur une ligne debordait de la carte des qu'un mode avait beaucoup a
     dire : on remplit ligne apres ligne, dans la largeur disponible */
  if(b.length){
    const larg=(BW-2*R(26*K))-R(24*K);
    let cur='';
    for(const f of b){
      const essai = cur ? cur+'   '+f : f;
      if(cur && sw(essai)>larg){ L.push(cur); cur=f; }
      else cur=essai;
    }
    if(cur) L.push(cur);

  return L;

function modeUI(){

function start(which){
  mode = which==='duo' ? 'duo' : 'solo';
  newGame();
}

/* ===================== partie ===================== */
function newGame(){
  discs=[];
  const c=W/2, inner=2*PR+0.6, outer=4*PR+1.2;
  if(cfg.reine) discs.push(mk(c,c,'Q'));
  if(cfg.pions===9){
    /* la fleur classique : six au centre, douze autour */
    for(let i=0;i<6;i++){ const a=-Math.PI/2+i*Math.PI/3; discs.push(mk(c+Math.cos(a)*inner,c+Math.sin(a)*inner, cfg.camps?(i%2?'W':'B'):'W')); }
    for(let i=0;i<12;i++){ const a=-Math.PI/2+i*Math.PI/6; discs.push(mk(c+Math.cos(a)*outer,c+Math.sin(a)*outer, cfg.camps?(i%2?'B':'W'):'W')); }
  } else {
    const tot=2*cfg.pions;
    let pose=0, anneau=1;
    while(pose<tot){
      const cap=anneau*6, n=Math.min(cap,tot-pose), rad=inner*anneau;
      for(let i=0;i<n;i++){
        const a=-Math.PI/2+i*Math.PI*2/cap;
        discs.push(mk(c+Math.cos(a)*rad,c+Math.sin(a)*rad, cfg.camps?((pose+i)%2?'W':'B'):'W'));
      }
      pose+=n; anneau++;
    }
  }
  striker={x:(BASE_X0+BASE_X1)/2,y:baseY('W'),vx:0,vy:0,r:SR,m:1.9,type:'S',alive:true};
  turn='W'; phase='aim'; aiPlan=null; aiWait=0; aimPw=0; aimX=0; majAim(); placeTouche=false; pause=false;
  rotT=0; rotGoal=0; placeX=(BASE_X0+BASE_X1)/2;
  sinking=[]; pops=[]; scorePop={W:0,B:0};
  queenState={owner:null,pendingBy:null}; strokePocketed=[];
  score={W:0,B:0}; tirsFaits=0; comboDernier=0; penalite={W:0,B:0}; etoilesFin=0;
  tempsMs=cfg.temps?cfg.temps*1000:0;
  bannerT=0;
  notes=[];
  if(!cfg.soloStrict) note('AU TOUR DE '+nomCote(turn),turn,ANNONCE);
}
function mk(x,y,type){ return {x,y,vx:0,vy:0,r:PR,m:1,type,alive:true}; }

function step(){
  let moving=false;
  for(let s=0;s<SUB;s++){
    const bodies=liveB();
    for(const b of bodies){ b.x+=b.vx/SUB; b.y+=b.vy/SUB; b.vx*=FRICTION; b.vy*=FRICTION; }
    for(let i=0;i<bodies.length;i++) for(let j=i+1;j<bodies.length;j++) collide(bodies[i],bodies[j]);
    for(const b of bodies){
      let sunk=false;
      for(const p of POCKETS){
        const dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy);
        if(d<POCK){ pocket(b,p); sunk=true; break; }
        /* levre du trou : un jeton qui arrive doucement au bord bascule dedans */
        const lip=POCK+b.r*0.5;
        if(d<lip && d>0.01){
          const sp=Math.hypot(b.vx,b.vy);
          if(sp<3.2){ const k2=(1-d/lip)*0.30/SUB; b.vx+=dx/d*k2; b.vy+=dy/d*k2; }
        }
      }
      if(sunk) continue;
      if(b.x-b.r<MINX){ b.x=MINX+b.r; sndBande(Math.abs(b.vx)); b.vx=Math.abs(b.vx)*REST_W; }
      if(b.x+b.r>MAXX){ b.x=MAXX-b.r; sndBande(Math.abs(b.vx)); b.vx=-Math.abs(b.vx)*REST_W; }
      if(b.y-b.r<MINY){ b.y=MINY+b.r; sndBande(Math.abs(b.vy)); b.vy=Math.abs(b.vy)*REST_W; }
      if(b.y+b.r>MAXY){ b.y=MAXY-b.r; sndBande(Math.abs(b.vy)); b.vy=-Math.abs(b.vy)*REST_W; }
    }
  }
  for(const b of liveB()){ if(Math.hypot(b.vx,b.vy)<STOP){ b.vx=0; b.vy=0; } else moving=true; }
  return moving;
}
function liveB(){ const a=discs.filter(d=>d.alive); if(striker.alive) a.push(striker); return a; }
function collide(a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  let d=Math.hypot(dx,dy); const mn=a.r+b.r;
  if(d>=mn) return; if(d===0) d=0.01;
  const nx=dx/d, ny=dy/d, inv=1/a.m+1/b.m, push=(mn-d)/inv;
  a.x-=nx*push/a.m; a.y-=ny*push/a.m; b.x+=nx*push/b.m; b.y+=ny*push/b.m;
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(vn>0) return;
  const j=-(1+REST_D)*vn/inv;
  sndChoc(-vn);
  a.vx-=j*nx/a.m; a.vy-=j*ny/a.m; b.vx+=j*nx/b.m; b.vy+=j*ny/b.m;
}
function pocket(b,p){
  b.alive=false; b.vx=0; b.vy=0; strokePocketed.push(b.type);
  /* un jeton adverse ou le palet, c'est rate ; le sien ou la reine, c'est gagne */
  const rate = (b.type==='S') || (b.type!==turn && b.type!=='Q');
  shakeT = rate ? R(12*K) : R(7*K);
  sinking.push({x:b.x,y:b.y,px:p.x,py:p.y,r:b.r,type:b.type,t:16,d:16,rate});
  pops.push({x:p.x,y:p.y,t:rate?26:22,d:rate?26:22,type:b.type,rate});
  if(!rate && (b.type==='W'||b.type==='B')) scorePop[b.type]=20;
  sndPoche(rate);
}

/* Resolution d'un tir : appelee seulement quand tout est immobile.
   Elle ne connait pas la physique, uniquement la configuration active. */
function endStroke(){
  const adv = turn==='W'?'B':'W';
  const mien   = strokePocketed.filter(t=>t===turn).length;
  const autres = strokePocketed.filter(t=>t===adv).length;
  const faute  = strokePocketed.includes('S');
  const reine  = strokePocketed.includes('Q');
  tirsFaits++;

  /* --- score --- */
  if(cfg.but==='points'||cfg.but==='vider'){
    let pts=0;
    for(const t of strokePocketed){ if(t==='S'||t==='Q') continue; pts += cfg.valeurs[t]||0; }
    const n=strokePocketed.filter(t=>t!=='S').length;
    if(cfg.combo && n>0) pts *= cfg.combo[Math.min(n,cfg.combo.length)-1];
    comboDernier = cfg.combo ? n : 0;
    score[turn]+=pts;
    if(cfg.bonusTemps && n>0) tempsMs += n*cfg.bonusTemps*1000;
  }

  /* --- garder la main ? --- */
  let garde = cfg.garderTour && (cfg.but==='couleur' ? mien>0 : strokePocketed.some(t=>t!=='S'));

  /* --- faute de palet --- */
  if(faute){
    if(cfg.fauteTour) garde=false;
    if(cfg.fauteRetour){
      const back=discs.find(d=>!d.alive&&d.type===turn);
      if(back) respawn(back); else penalite[turn]++;
    }
  }
  /* penalite differee : des qu'un jeton devient disponible */
  if(penalite[turn]>0){
    const back=discs.find(d=>!d.alive&&d.type===turn);
    if(back){ respawn(back); penalite[turn]--; }
  }

  /* --- jeton adverse --- */
  if(autres>0){
    if(cfg.advTour) garde=false;
    if(cfg.adverse==='revient')
      for(const d of discs) if(!d.alive&&d.type===adv&&strokePocketed.includes(adv)){ respawn(d); break; }
  }

  /* --- la reine --- */
  if(cfg.reine){
    /* sans camps attitres, « un jeton a soi » devient « un jeton quelconque » */
    const parCouleur = cfg.but==='couleur';
    const couvre = parCouleur ? mien>0 : strokePocketed.some(t=>t!=='S'&&t!=='Q');
    const dejaUnPion = parCouleur ? discs.some(d=>!d.alive&&d.type===turn) : score[turn]>0;
    if(reine){
      if(cfg.reineApresPion && !dejaUnPion && !couvre){
        const q=discs.find(d=>d.type==='Q'); if(q&&!q.alive) respawn(q);   /* trop tot : elle repart au centre */
      } else if(cfg.couvrir==='non'){
        queenState.owner=turn; if(cfg.but==='points') score[turn]+=cfg.valeurs.Q;
      } else if(cfg.couvrir==='meme' && couvre){
        queenState.owner=turn; if(cfg.but==='points') score[turn]+=cfg.valeurs.Q;
      } else {
        queenState.pendingBy=turn; garde=true;                             /* a couvrir au tir suivant */
      }
    } else if(queenState.pendingBy===turn){
      if(couvre){ queenState.owner=turn; queenState.pendingBy=null;
                  if(cfg.but==='points') score[turn]+=cfg.valeurs.Q; }
      else { const q=discs.find(d=>d.type==='Q'); if(q&&!q.alive) respawn(q); queenState.pendingBy=null; }
    }
  }

  strokePocketed=[];
  striker.alive=true; striker.vx=striker.vy=0; aimPw=0;

  /* --- fin de partie --- */
  const fini=testerFin();
  if(fini) return;

  if(cfg.soloStrict) garde=true;      /* mode a un seul joueur : la main reste */

  /* --- dire pourquoi --- */
  if(!cfg.soloStrict){
    /* chaque mot porte le nom de celui qu'il concerne, en plus de sa couleur :
       le nom se lit meme quand on ne regarde pas le bandeau des scores */
    const qui=nomCote(turn);
    let raison='';
    if(faute)                                          raison=qui+' : PALET EMPOCHÉ';
    else if(autres>0)                                  raison=qui+' : JETON ADVERSE';
    else if(cfg.reine&&queenState.pendingBy===turn)    raison=qui+' COUVRE LA REINE';
    else if(cfg.reine&&reine&&queenState.owner===turn) raison=qui+' GAGNE LA REINE';
    else if(garde)                                     raison=qui+' REJOUE';
    if(raison) note(raison, turn);
  }

  const before=turn;
  if(!garde) turn = adv;
  phase='aim'; aiPlan=null;
  /* chaque nouveau tir repart d'un etat neutre : palet au milieu de sa ligne,
     visee droit devant, force a zero */
  placeX=(BASE_X0+BASE_X1)/2;
  placeStriker(placeX);
  aimPw=0; aimX=0; majAim(); placeTouche=false;
  if(turn!==before){
    bannerT=24;
    /* la main change : on annonce qui prend la suite */
    if(!cfg.soloStrict) note('AU TOUR DE '+nomCote(turn),turn,ANNONCE);
    if(mode==='duo') rotGoal = (turn==='B') ? Math.PI : 0;
  }
}

/* Conditions de victoire, selon le but du mode */
function testerFin(){
  const reineOk = !cfg.reine || queenState.owner!==null;
  if(cfg.but==='couleur'){
    const finW=remaining('W')===0, finB=remaining('B')===0;
    if(finW||finB){
      const qui = finW?'W':'B';
      if(reineOk){ finish(qui); return true; }
      /* dernier jeton empoche alors que la reine restait a valider : la manche est perdue */
      finish(qui==='W'?'B':'W'); return true;
    }
    return false;
  }
  if(cfg.but==='vider'){
    if(discs.every(d=>!d.alive)){ etoiles(); finish('W'); return true; }
    if(cfg.tirs && tirsFaits>=cfg.tirs){ etoiles(); finish('B'); return true; }
    return false;
  }
  /* points */
  if(cfg.cible && score.W>=cfg.cible){ finish('W'); return true; }
  if(cfg.cible && score.B>=cfg.cible){ finish('B'); return true; }
  if(discs.every(d=>!d.alive)){ finish(score.W>=score.B?'W':'B'); return true; }
  if(cfg.tirs && tirsFaits>=cfg.tirs){ finish(score.W>=score.B?'W':'B'); return true; }
  return false;
}
function etoiles(){
  etoilesFin=0;
  if(!cfg.etoiles) return;
  if(tirsFaits<=cfg.etoiles[0]) etoilesFin=3;
  else if(tirsFaits<=cfg.etoiles[1]) etoilesFin=2;
  else if(tirsFaits<=cfg.etoiles[2]) etoilesFin=1;
}
function placeStriker(tx){
  const lo=BASE_X0, hi=BASE_X1, want=Math.min(hi,Math.max(lo,tx));
  for(let off=0; off<=(hi-lo); off+=5){
    for(const x of (off===0?[want]:[want-off,want+off])){
      if(x<lo||x>hi) continue;
      if(strikerFree(x)){ striker.x=x; striker.y=baseY(turn); return true; }
    }
  }
  striker.x=want; striker.y=baseY(turn); return false;
}
function strikerFree(x){
  const by=baseY(turn);
  for(const d of discs){ if(!d.alive) continue; if(Math.hypot(d.x-x,d.y-by)<d.r+SR+1.5) return false; }
  return true;
}
/* Un jeton rendu revient pres du centre, sur la premiere place libre */
function respawn(d){
  const c=W/2;
  for(let ring=0;ring<14;ring++){
    const rad=ring*(PR*1.6), n=ring===0?1:ring*6;
    for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, x=c+Math.cos(a)*rad, y=c+Math.sin(a)*rad;
      if(freeSpot(x,y,d)){ d.x=x; d.y=y; d.vx=d.vy=0; d.alive=true; return; } }
  }
  for(let y=MINY+PR+2;y<MAXY-PR-2;y+=PR) for(let x=MINX+PR+2;x<MAXX-PR-2;x+=PR)
    if(freeSpot(x,y,d)){ d.x=x; d.y=y; d.vx=d.vy=0; d.alive=true; return; }
  d.x=c; d.y=c; d.vx=d.vy=0; d.alive=true;
}
function freeSpot(x,y,self){
  if(x<MINX+PR||x>MAXX-PR||y<MINY+PR||y>MAXY-PR) return false;
  for(const p of POCKETS) if(Math.hypot(p.x-x,p.y-y)<POCK+PR) return false;
  for(const o of discs){ if(o===self||!o.alive) continue; if(Math.hypot(o.x-x,o.y-y)<PR*2+2) return false; }
  if(striker.alive&&Math.hypot(striker.x-x,striker.y-y)<PR+SR+2) return false;
  return true;
}
function remaining(side){ return discs.filter(d=>d.alive&&d.type===side).length; }
function finish(side){
  phase='over';
  bannerTxt = (mode==='solo') ? (side==='W'?'GAGNÉ !':'PERDU') : (side==='W'?'CLAIRS !':'FONCÉS !');
  bannerT=1e9;
  sndFin(mode!=='solo'||side==='W');
  majRecord(side);
}

/* ===================== IA ===================== */
function clearPath(x0,y0,x1,y1,rad,skip){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy);
  if(L<1) return true;
  const ux=dx/L, uy=dy/L;
  for(const d of discs){
    if(!d.alive||skip.indexOf(d)>=0) continue;
    const t=(d.x-x0)*ux+(d.y-y0)*uy;
    if(t<-d.r||t>L+d.r) continue;
    const cl=Math.max(0,Math.min(L,t));
    if(Math.hypot(d.x-(x0+ux*cl), d.y-(y0+uy*cl))<d.r+rad-1.5) return false;
  }
  return true;
}
function planShot(){
  const BY=baseY(turn);
  const mine=discs.filter(d=>d.alive&&d.type===turn);
  const targets=mine.slice();
  const q=discs.find(d=>d.type==='Q');
  if(q&&q.alive&&!queenState.owner&&mine.length<=6) targets.push(q);
  let best=null;
  for(const p of targets) for(const k of POCKETS){
    const kx=k.x-p.x, ky=k.y-p.y, dk=Math.hypot(kx,ky);
    if(dk<PR) continue;
    const ux=kx/dk, uy=ky/dk;
    if(!clearPath(p.x,p.y,k.x,k.y,PR,[p])) continue;
    const cx=p.x-ux*(PR+SR), cy=p.y-uy*(PR+SR);
    if(cx<MINX+SR||cx>MAXX-SR||cy<MINY+SR||cy>MAXY-SR) continue;
    for(let sx=BASE_X0; sx<=BASE_X1; sx+=12){
      const ddx=cx-sx, ddy=cy-BY, dd=Math.hypot(ddx,ddy);
      if(dd<SR*2) continue;
      const ax=ddx/dd, ay=ddy/dd, cut=ax*ux+ay*uy;
      if(cut<0.36||!strikerFree(sx)) continue;
      if(!clearPath(sx,BY,cx,cy,SR,[p])) continue;
      const sc=cut*2.6-dd/900-dk/1300+(p.type==='Q'?0.2:0);
      if(!best||sc>best.sc) best={sc,sx,ax,ay,dd,dk,cut};
    }
  }
  if(!best) return breakShot();
  const need=(0.40+best.dd/1700+best.dk/1300)/Math.max(0.45,best.cut);
  const pow=Math.max(0.28,Math.min(1,need))*MAXPOW;
  const a=Math.atan2(best.ay,best.ax)+(Math.random()-0.5)*LEVELS[level].e;
  return {sx:best.sx, vx:Math.cos(a)*pow, vy:Math.sin(a)*pow};
}
function breakShot(){
  const mine=discs.filter(d=>d.alive&&d.type===turn);
  let tx=W/2, ty=W/2;
  if(mine.length){ const t=mine[Math.floor(Math.random()*mine.length)]; tx=t.x; ty=t.y; }
  let sx=Math.min(BASE_X1,Math.max(BASE_X0,tx));
  if(!strikerFree(sx)){ for(let o=6;o<400;o+=6){ if(strikerFree(sx-o)){sx-=o;break;} if(strikerFree(sx+o)){sx+=o;break;} } }
  const a=Math.atan2(ty-baseY(turn),tx-sx)+(Math.random()-0.5)*0.10;
  return {sx, vx:Math.cos(a)*MAXPOW*(0.55+Math.random()*0.3), vy:Math.sin(a)*MAXPOW*(0.55+Math.random()*0.3)};
}

/* ===================== sons ===================== */
/* tout est synthetise a la volee : pas d'echantillons, l'esprit huit bits du reste */
let son=1, audio=null, chocCd=0, bandeCd=0;
function sndCtx(){
  if(!son) return null;
  if(!audio){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    audio=new AC();
  }
  if(audio.state==='suspended') audio.resume();
  return audio;
}
function bip(freq,dur,vol,glide){
  const a=sndCtx(); if(!a) return;
  const t0=a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type='square'; o.frequency.setValueAtTime(freq,t0);
  if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(30,glide),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function bruitSec(dur,vol){
  const a=sndCtx(); if(!a) return;
  const n=Math.max(1,Math.floor(a.sampleRate*dur)), buf=a.createBuffer(1,n,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=vol;
  s.connect(g); g.connect(a.destination); s.start();
}
/* Choc de deux pieces de bois. Un simple bruit blanc claque comme du
   plastique ; ce qu'on reconnait au bois, c'est le claquement tres bref suivi
   d'un corps resonant de quelques modes inharmoniques qui s'eteignent
   aussitot. D'ou les deux couches empilees ici.
   vol : niveau general, aigu : multiplicateur de hauteur (le cadre sonne plus
   grave que les jetons), duree : extinction du corps. */
function bois(vol,aigu,duree){
  const a=sndCtx(); if(!a) return;
  const t0=a.currentTime;
  const sortie=a.createGain();
  sortie.gain.value=vol;
  sortie.connect(a.destination);

  /* le claquement, et c'est lui qui porte presque tout : dix-huit
     millisecondes de bruit passe en bande large, monte deux fois plus haut que
     le corps. Le bois n'a ni le sifflement des aigus purs ni le grondement des
     graves, d'ou le filtre. */
  const n=Math.max(1,Math.floor(a.sampleRate*0.018));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++){ const k=1-i/n; d[i]=(Math.random()*2-1)*k*k; }
  const s=a.createBufferSource(); s.buffer=buf;
  const bp=a.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.setValueAtTime(1800*aigu,t0); bp.Q.value=0.6;
  const gc=a.createGain(); gc.gain.value=2;
  s.connect(bp); bp.connect(gc); gc.connect(sortie); s.start(t0);

  /* le corps : deux modes seulement, discrets et vite eteints. Juste assez
     pour qu'on entende de la matiere derriere le contact, pas assez pour que
     ca chante - c'est ce qui rend le choc mat. */
  const modes=[[1,0.22,0.4],[2.6,0.10,0.25]];
  for(const [rap,amp,tenue] of modes){
    const o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(520*aigu*rap,t0);
    g.gain.setValueAtTime(amp,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+duree*tenue);
    o.connect(g); g.connect(sortie);
    o.start(t0); o.stop(t0+duree+0.02);
  }
}
function sndChoc(v){
  if(chocCd>0) return;
  const f=Math.min(1,v/14);
  if(f<0.06) return;
  chocCd=3;
  /* plus le choc est franc, plus il claque haut et resonne longtemps */
  bois(0.10+f*0.26, 0.9+f*0.45, 0.030+f*0.020);
}
function sndBande(v){
  if(bandeCd>0||v<2.2) return;
  bandeCd=4;
  const f=Math.min(1,v/14);
  /* le cadre est une piece bien plus grosse : plus grave, un rien plus long */
  bois(0.09+f*0.14, 0.5, 0.055+f*0.015);
}
function sndPoche(rate){
  if(rate){ bip(220,0.16,0.10,110); bip(110,0.22,0.10,55); }
  else { bip(660,0.09,0.07); setTimeout(()=>bip(880,0.12,0.07),70); }
}
function sndTir(pow){ bruitSec(0.02+pow*0.02, 0.04+pow*0.08); }
function sndFin(gagne){
  if(gagne) [523,659,784,1047].forEach((f,i)=>setTimeout(()=>bip(f,0.16,0.08),i*110));
  else      [392,330,262].forEach((f,i)=>setTimeout(()=>bip(f,0.20,0.08),i*140));
}

let records={};
function sauver(){
  try{ localStorage.setItem('karom', JSON.stringify({level,fireMode,theme,son,records})); }catch(e){}
}
function chargerSauvegarde(){
  try{
    const d=JSON.parse(localStorage.getItem('karom'));
    if(!d) return;
    if(d.level>=0&&d.level<LEVELS.length) level=d.level;
    if(d.fireMode===0||d.fireMode===1) fireMode=d.fireMode;
    if(d.theme===0||d.theme===1) theme=d.theme;
    if(d.son===0||d.son===1) son=d.son;
    if(d.records&&typeof d.records==='object') records=d.records;
  }catch(e){}

/* le record d'un mode : moins de tirs au nettoyage, plus de points dans les
   modes en solo, nombre de victoires contre l'ordinateur ailleurs */
function majRecord(side){
  if(mode!=='solo') return;
  const r=records[modeId];
  if(cfg.but==='vider'){
    if(side!=='W') return;
    if(!r||tirsFaits<r.tirs||(tirsFaits===r.tirs&&etoilesFin>(r.etoiles||0)))
      records[modeId]={tirs:tirsFaits,etoiles:etoilesFin};
  } else if(cfg.soloStrict){
    if(!r||score.W>r.score) records[modeId]={score:score.W};
  } else {
    if(side!=='W') return;
    records[modeId]={vic:((r&&r.vic)||0)+1};
  }
  sauver();
}

function humanTurn(){ return !(mode==='solo'&&turn===AI); }
function zone(c){
  if(c.cy<BOARD_Y) return 'hud';

  if(c.cy<CTRL_Y)  return 'msg';
  if(c.cy<BTN_Y) return (c.cy<PWR.y-R(5*K)) ? 'track' : 'joy';

function btnSlots(){
  if(phase==='menu') return [];        /* les menus portent leurs propres boutons */
  if(phase==='over') return [];        /* la fin de partie a ses boutons sous le bandeau */
  if(pause) return [];                 /* en pause, tout est dans la fenetre */
  const p={id:'pause',l:'PAUSE',ico:'pause'};
  if(fireMode===0) return [p];
  return [{id:'fire',l:'TIRER'},p];   /* TIRER reste indispensable dans ce mode */
}
function btnRects(){
  const sl=btnSlots(), n=sl.length, out=[];
  if(!n) return out;
  const gap=Math.round(4*K), pad=Math.round(6*K), w=Math.floor((BUF-2*pad-gap*(n-1))/n);
  for(let i=0;i<n;i++) out.push({x:pad+i*(w+gap), y:BTN_Y+Math.round(3*K), w, h:BTN_H-Math.round(7*K), id:sl[i].id, l:sl[i].l, ico:sl[i].ico});

function onDown(e){
  const c=toCanvas(e), z=zone(c);
  if(z==='btn'&&phase!=='menu'){
    for(const b of btnRects()) if(c.cx>=b.x&&c.cx<=b.x+b.w){

      if(b.id==='back')  page='titre';

      else if(b.id==='next') rulePage=(rulePage+1)%RULES.length;

      else if(b.id==='fire')  fire();
      else if(b.id==='pause')     pause=true;
      else if(b.id==='reprendre') pause=false;
      break;
    }
    e.preventDefault(); return;
  }
  if(phase==='menu'){
    if(page==='regles'){
      const u=reglesUI(), bx=c.cx-BX, by=c.cy-hautPage();
      const dans=(r)=>bx>=r.x&&bx<=r.x+r.w&&by>=r.y&&by<=r.y+r.h;
      if(dans(u.prev))      { press={id:'fen-prev',t:9}; rulePage=(rulePage-1+RULES.length)%RULES.length; }
      else if(dans(u.next)) { press={id:'fen-next',t:9}; rulePage=(rulePage+1)%RULES.length; }
      else if(dans(u.back)) { press={id:'fen-back',t:9}; page='titre'; }
      e.preventDefault(); return;
    }
    if(page==='titre'){
      const by=c.cy-hautPage(), bx=c.cx-BX, u=carrousel();
      const dans=(r)=>bx>=r.x&&bx<=r.x+r.w&&by>=r.y&&by<=r.y+r.h;
      if(dans(u.gauche))       { press={id:'prev',t:9};  defiler(-1); }
      else if(dans(u.droite))  { press={id:'next',t:9};  defiler(1); }
      else if(dans(u.start))   { press={id:'start',t:9}; start(modeChoix===1?'duo':'solo'); }
      else if(dans(u.regl))    { press={id:'set',t:9};   openMode(); }
      else if(dans(u.regles))  { press={id:'rules',t:9}; page='regles'; rulePage=0; }
    } else if(page==='mode'){
      const u=modeUI(), bx=BX+u.btn.x, by=BOARD_Y+u.btn.y;
      if(c.cx>=bx&&c.cx<=bx+u.btn.w&&c.cy>=by&&c.cy<=by+u.btn.h){
        press={id:'fen-back',t:9}; page='titre'; e.preventDefault(); return;
      }
      for(const r of optRects())
        if(c.cx>=r.x&&c.cx<=r.x+r.w&&c.cy>=r.y&&c.cy<=r.y+r.h){
          press={id:r.k+r.i,t:9};
          if(r.k==='jou') modeChoix=r.i;
          else if(r.k==='lvl') level=r.i;
          else if(r.k==='the'){ theme=r.i; applyTheme(); }
          else if(r.k==='son') son=r.i?0:1;
          else fireMode=r.i;
          sauver();
          break;
        }
    }
    e.preventDefault(); return;
  }
  if(phase==='over'){
    const u=bandeauUI();
    const dans=(r)=>c.cx>=r.x&&c.cx<=r.x+r.w&&c.cy>=r.y&&c.cy<=r.y+r.h;
    if(dans(u.menu)) { press={id:'fin-menu',t:9};  openMenu(); }
    else if(dans(u.again)){ press={id:'fin-again',t:9}; newGame(); }
    e.preventDefault(); return;
  }
  if(pause){
    const u=modeUI();
    const dans=(r)=>r&&c.cx>=BX+r.x&&c.cx<=BX+r.x+r.w&&c.cy>=BOARD_Y+r.y&&c.cy<=BOARD_Y+r.y+r.h;
    if(dans(u.btn)) { press={id:'fen-back',t:9};  pause=false; e.preventDefault(); return; }
    if(dans(u.btn2)){ press={id:'fen-again',t:9}; pause=false; newGame(); e.preventDefault(); return; }
    if(dans(u.btn3)){ press={id:'fen-menu',t:9};  pause=false; openMenu(); e.preventDefault(); return; }
    for(const r of optRects())
      if(c.cx>=r.x&&c.cx<=r.x+r.w&&c.cy>=r.y&&c.cy<=r.y+r.h){
        press={id:r.k+r.i,t:9};
        if(r.k==='lvl') level=r.i; else if(r.k==='tir') fireMode=r.i;
        else if(r.k==='the'){ theme=r.i; applyTheme(); }
        else if(r.k==='son') son=r.i?0:1;
        sauver();
        break;
      }
    e.preventDefault(); return;
  }
  if(phase!=='aim'||!humanTurn()||bannerT>0||rotT!==rotGoal){ e.preventDefault(); return; }
  joyDrag=null; trkDrag=false;   /* un nouveau contact repart de zero */

  else if(z==='joy'){
    const j=jetonManette();
    /* seule une prise sur le jeton lui-meme arme la visee */
    if(Math.hypot(c.cx-j.x,c.cy-j.y)<=j.r+R(9*K)){ joyDrag={moved:0,x:c.cx,y:c.cy}; joyTo(c); }
  }
  e.preventDefault();
}
function onMove(e){
  const c=toCanvas(e);
  if(trkDrag){ trackTo(c.cx); e.preventDefault(); return; }
  if(joyDrag){
    joyDrag.moved=Math.max(joyDrag.moved,Math.hypot(c.cx-joyDrag.x,c.cy-joyDrag.y));
    joyTo(c);
    e.preventDefault(); return;
  }
}
function onUp(e){
  if(trkDrag){ trkDrag=false; e.preventDefault(); return; }
  if(joyDrag){
    const bouge=joyDrag.moved>=R(10*K);
    joyDrag=null;
    if(fireMode===0 && bouge) fire();
    e.preventDefault(); return;
  }
  e.preventDefault();
}
function trackTo(cx){
  placeTouche=true;
  let t=Math.min(1,Math.max(0,(cx-TRK.x0)/(TRK.x1-TRK.x0)));
  if(flipped()) t=1-t;
  placeX=BASE_X0+t*(BASE_X1-BASE_X0);
  placeStriker(placeX);
}
/* la visee est stockee dans le repere du joueur ; on la convertit en repere plateau */
function currentShot(){
  const f=flipped()?-1:1;
  return {ux:f*Math.cos(aimAng), uy:f*Math.sin(aimAng), pow:aimPw};
}
function fire(){
  if(phase!=='aim'||!humanTurn()||bannerT>0) return;
  const s2=currentShot();
  if(!s2||s2.pow<0.10) return;
  striker.vx=s2.ux*s2.pow*MAXPOW; striker.vy=s2.uy*s2.pow*MAXPOW;
  sndTir(s2.pow);
  phase='roll'; aimPw=0;
}
function jetonManette(){
  const marge=R(12*K), LP=BUF-2*marge;
  const jr=R(13*K);
  const span=Math.max(R(6*K),Math.floor(JOY_H/2)-jr-R(6*K)), spanX=Math.round(LP/2)-jr-R(8*K);
  return {x:JOY.cx+aimX*spanX, y:JOY.cy-span+2*span*aimPw, r:jr, span, spanX};
}
function joyTo(c){
  if(!joyDrag) return;
  if(joyDrag.px===undefined){ joyDrag.px=c.cx; joyDrag.py=c.cy; return; }
  const dx=c.cx-joyDrag.px, dy=c.cy-joyDrag.py;
  const course=Math.max(1,(BUF-2*R(12*K))/2);      /* demi-largeur du pave */
  aimX = Math.min(1,Math.max(-1, aimX+dx/course)); /* borne : on ne depasse pas les butees */
  majAim();
  /* la course en puissance vaut celle du jeton : il colle au doigt */
  aimPw = Math.min(1,Math.max(0, aimPw+dy/Math.max(1,2*jetonManette().span)));
  joyDrag.px=c.cx; joyDrag.py=c.cy;
}

/* ===================== primitives pixel ===================== */
function pcircle(g,cx,cy,r,c){
  cx=Math.round(cx); cy=Math.round(cy); r=Math.round(r);
  g.fillStyle=c;
  for(let dy=-r;dy<=r;dy++){ const h=Math.floor(Math.sqrt(Math.max(0,r*r-dy*dy))+0.5); g.fillRect(cx-h,cy+dy,h*2+1,1); }
}
function pring(g,cx,cy,r,c,a0,a1){
  cx=Math.round(cx); cy=Math.round(cy); r=Math.round(r);
  a0=a0===undefined?0:a0; a1=a1===undefined?360:a1;
  g.fillStyle=c;
  for(let a=a0;a<a1;a+=1.4){ const rd=a*Math.PI/180; g.fillRect(cx+Math.round(Math.cos(rd)*r), cy+Math.round(Math.sin(rd)*r),1,1); }
}
function pline(g,x0,y0,x1,y1,c){
  g.fillStyle=c;
  x0=Math.round(x0); y0=Math.round(y0); x1=Math.round(x1); y1=Math.round(y1);
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy;
  for(let n=0;n<900;n++){
    g.fillRect(x0,y0,1,1);
    if(x0===x1&&y0===y1) break;
    const e2=2*err;
    if(e2>-dy){ err-=dy; x0+=sx; }
    if(e2<dx){ err+=dx; y0+=sy; }
  }
}
function arrow(g,x,y,ux,uy,c){
  g.fillStyle=c;
  const hz=Math.abs(ux)>Math.abs(uy);
  for(let i=0;i<3;i++){
    const bx=Math.round(x-ux*i*1.5), by=Math.round(y-uy*i*1.5);
    if(hz) g.fillRect(bx,by-i,1,i*2+1); else g.fillRect(bx-i,by,i*2+1,1);
  }
}
function padFill(g,x,y,w,h,r,col,dehors){
  g.fillStyle=col; g.fillRect(x,y,w,h);
  roundCut(g,x,y,x+w,y+h,r,dehors);
}
function roundCut(g,x0,y0,x1,y1,r,col){
  g.fillStyle=col;
  for(let dy=0;dy<r;dy++) for(let dx=0;dx<r;dx++){
    const d=Math.hypot(r-dx-0.5, r-dy-0.5);
    if(d<=r-0.2) continue;
    g.fillRect(x0+dx,y0+dy,1,1);
    g.fillRect(x1-1-dx,y0+dy,1,1);
    g.fillRect(x0+dx,y1-1-dy,1,1);
    g.fillRect(x1-1-dx,y1-1-dy,1,1);
  }
}
function plate(g,x,y,w,h,fill){
  g.fillStyle=P.edge; g.fillRect(x,y+2,w,h);
  g.fillStyle=fill;   g.fillRect(x,y,w,h);
  g.fillStyle=P.edge; g.fillRect(x,y,w,1); g.fillRect(x,y+h-1,w,1); g.fillRect(x,y,1,h); g.fillRect(x+w-1,y,1,h);
}

/* ===================== fond de plateau ===================== */
function bruit(x,y){
  let n=(x*73856093)^(y*19349663);
  n=(n<<13)^n;
  return ((n*(n*n*15731+789221)+1376312589)&0x7fffffff)/0x7fffffff;
}
function grain(g,x0,y0,x1,y1,dens,clair,sombre){
  if(!dens) return;
  for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){
    const r=bruit(x,y);
    if(r>1-dens){ g.fillStyle=clair;  g.fillRect(x,y,1,1); }
    else if(r<dens){ g.fillStyle=sombre; g.fillRect(x,y,1,1); }
  }
}
function rosace(g,cx,cy,RO,ink,red,fond,cercle,coeur){
  cercle=cercle||ink;
  const RI=Math.round(RO*24/26), br=Math.max(1,Math.round(RO*2.4/26));
  pcircle(g,cx,cy,RO,cercle); pcircle(g,cx,cy,RO-1,fond);
  pring(g,cx,cy,RO-Math.max(1,Math.round(RO*2/26)),cercle);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2, col=(i%2)?ink:red;
    const nx=-Math.sin(a), ny=Math.cos(a);
    for(let t=br;t<RI;t++){
      const w2=Math.max(0,Math.round(br*(1-t/RI)));
      const x=cx+Math.cos(a)*t, y=cy+Math.sin(a)*t;
      g.fillStyle=col;
      for(let o=-w2;o<=w2;o++) g.fillRect(Math.round(x+nx*o),Math.round(y+ny*o),1,1);
      g.fillStyle=ink;
      g.fillRect(Math.round(x+nx*(w2+1)),Math.round(y+ny*(w2+1)),1,1);
      g.fillRect(Math.round(x-nx*(w2+1)),Math.round(y-ny*(w2+1)),1,1);
    }
  }
  const cr=Math.max(2,Math.round(RO*6/26));
  /* cercle pointille au diametre d'origine, puis un coeur plus petit */
  const col=coeur||red;
  for(let a=0;a<360;a+=24){
    const rd=a*Math.PI/180;
    g.fillStyle=col;
    g.fillRect(Math.round(cx+Math.cos(rd)*cr),Math.round(cy+Math.sin(rd)*cr),1,1);
  }
  /* ---- coeur : vert plein, ponctue comme le cercle pointille de l'etoile ----
     memes points, meme espacement angulaire, alignes sur les huit branches ---- */
  const rc=Math.max(3,Math.round(cr*0.62));
  pcircle(g,cx,cy,rc,col);
  g.fillStyle=fond;
  const rp=Math.max(2,rc-2);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4-Math.PI/2;
    g.fillRect(Math.round(cx+Math.cos(a)*rp),Math.round(cy+Math.sin(a)*rp),1,1);
  }
  if(COEUR>0) g.fillRect(cx,cy,1,1);        /* un point au centre, en option */
}
function buildBg(){
  const c=document.createElement('canvas'); c.width=BW; c.height=BW;
  const g=c.getContext('2d');
  const F=R(FRAME*S), E=BW, M=BW/2;
  const felt  = ART.pale ? '#EFE2C2' : P.felt;
  const feltH = ART.pale ? '#F8F0DC' : P.feltHi;
  const feltL = ART.pale ? '#DFCEA6' : P.feltLo;

  /* ---- cadre noyer : quatre traitements de fil, tous en voile translucide ---- */
  g.fillStyle=P.woodLo; g.fillRect(0,0,E,E);
  g.fillStyle=P.wood;   g.fillRect(1,1,E-2,E-2);
  const fil=(i,c)=>{
    g.fillStyle=c;
    g.fillRect(1,i,F-1,1); g.fillRect(E-F,i,F-1,1);
    g.fillRect(i,1,1,F-1); g.fillRect(i,E-F,1,F-1);
  };
  const CLAIR='rgba(255,236,206,', SOMBRE='rgba(0,0,0,';
  for(let i=2;i<E-2;i++){
    let n, a=0.05, b=0.09;
    if(WOOD===0){ n=Math.sin(i*0.9)+Math.sin(i*0.21)*1.4+Math.sin(i*2.3)*0.5; }
    else if(WOOD===1){ n=Math.sin(i*2.1)+Math.sin(i*0.53)*1.1; a=0.04; b=0.06; }
    else if(WOOD===2){ n=Math.sin(i*0.11)*1.7+Math.sin(i*0.29)*0.9; a=0.06; b=0.10; }
    else { n=Math.sin(i*0.07)*1.9; a=0.03; b=0.05; }
    if(n>1.3) fil(i, CLAIR+a+')');
    else if(n<-1.4) fil(i, SOMBRE+b+')');
  }
  if(WOOD===2){                                  /* quelques noeuds epars */
    for(const k of [[F/2,E*0.28],[E-F/2,E*0.66],[E*0.35,F/2],[E*0.72,E-F/2]]){
      pring(g,k[0],k[1],R(4*K),'rgba(0,0,0,.10)');
      pring(g,k[0],k[1],R(7*K),'rgba(0,0,0,.06)');
    }
  }
  /* modele de lumiere : le cadre s'eclaire en haut a gauche, s'assombrit en bas a droite */
  g.fillStyle='rgba(255,236,206,.05)'; g.fillRect(0,0,E,F); g.fillRect(0,0,F,E);
  g.fillStyle='rgba(0,0,0,.09)';       g.fillRect(0,E-F,E,F); g.fillRect(E-F,0,F,E);
  /* petite texture de surface sur le bois */
  grain(g,0,0,E,E, TEX===2?0.16:(TEX?0.10:0), 'rgba(255,236,206,'+(TEX===2?0.075:0.05)+')',
                                              'rgba(0,0,0,'+(TEX===2?0.10:0.07)+')');
  g.fillStyle=P.woodLo;
  pline(g,0,0,F,F,P.woodLo); pline(g,E-1,0,E-1-F,F,P.woodLo);
  pline(g,0,E-1,F,E-1-F,P.woodLo); pline(g,E-1,E-1,E-1-F,E-1-F,P.woodLo);
  g.fillStyle=P.woodLo; g.fillRect(F-2,F-2,E-2*(F-2),E-2*(F-2));

  /* ---- surface : contreplaqué de bouleau, figure douce ---- */
  g.fillStyle=felt; g.fillRect(F,F,E-2*F,E-2*F);
  for(let x=F;x<E-F;x++){
    const n=Math.sin(x*0.31)*1.2+Math.sin(x*1.13)+Math.sin(x*0.07)*1.5;
    if(n>1.6){ g.fillStyle=feltH; g.fillRect(x,F,1,E-2*F); }
    else if(n<-1.9){ g.fillStyle=feltL; g.fillRect(x,F,1,E-2*F); }
  }
  /* meme petite texture sur la surface de jeu */
  grain(g,F,F,E-F,E-F, TEX===2?0.14:(TEX?0.09:0), 'rgba(255,252,236,'+(TEX===2?0.10:0.065)+')',
                                                  'rgba(90,60,20,'+(TEX===2?0.075:0.05)+')');

  const bo=R(BAND_O*S), bi=R(BAND_I*S);
  const o0=bo, o1=BW-bo, i0=bi, i1=BW-bi;

  /* ---- diagonales de coin, double pointe vers le trou ---- */
  for(const q of [[1,1],[-1,1],[1,-1],[-1,-1]]){
    const cx=q[0]>0?0:BW, cy=q[1]>0?0:BW;
    const d0=R((PIN+PAD)*S-POCK*S-R(3*K)), d1=R(BW*0.42);
    const ax=cx+q[0]*d0, ay=cy+q[1]*d0;
    const bx=cx+q[0]*d1, by=cy+q[1]*d1;
    pline(g,ax,ay,bx,by,P.ink);
    const L=Math.hypot(bx-ax,by-ay)||1, ux=(ax-bx)/L, uy=(ay-by)/L;
    arrow(g,ax,ay,ux,uy,P.ink);
    arrow(g,R(ax-ux*R(5*K)),R(ay-uy*R(5*K)),ux,uy,P.ink);
  }

  /* ---- double carré : le trait fin ferme l'angle, l'epais s'arrete aux pastilles ---- */
  const ligP=Math.round(((o0+1)+i0)/2), offP=Math.ceil((R(3*K)+1)*Math.SQRT2);
  const a0=ligP+offP, a1=BW-ligP-offP;      /* bornes des segments epais */
  g.fillStyle=P.ink;
  g.fillRect(a0,o0,a1-a0,2); g.fillRect(a0,o1-2,a1-a0,2);
  g.fillRect(o0,a0,2,a1-a0); g.fillRect(o1-2,a0,2,a1-a0);
  g.fillRect(i0,i0,i1-i0,1); g.fillRect(i0,i1-1,i1-i0,1);
  g.fillRect(i0,i0,1,i1-i0); g.fillRect(i1-1,i0,1,i1-i0);

  /* ---- KAROM en petit, centre dans le couloir entre les deux traits ---- */
  const tw2=pw('KAROM'), tx=Math.round(M-tw2/2);
  const tyHaut=Math.round(((o0+2)+(i0-1))/2-PH/2);
  const tyBas =Math.round(((i1)+(o1-2))/2-PH/2);
  ptext(g,'KAROM',tx,tyHaut,P.ink);
  ptext(g,'KAROM',tx,tyBas,P.ink);
  /* Une petite fleche de chaque cote du mot, pointes vers l'exterieur.
     Tracee ici plutot qu'avec arrow() : celle-ci avance de 1,5 pixel par
     cran, ce que l'arrondi coupe en deux sur un axe horizontal. En diagonale
     l'arrondi tombe juste, d'ou les pointes pleines du reste du plateau. */
  const pointeH=(x,ym,sens)=>{
    g.fillStyle=P.ink;
    for(let i=0;i<3;i++) g.fillRect(x-sens*i, ym-i, 1, i*2+1);
  };
  for(const ty of [tyHaut,tyBas]){
    const ym=ty+Math.floor(PH/2), ecart=R(10*K);
    pointeH(tx-ecart,        ym, -1);
    pointeH(tx+tw2+ecart-1,  ym,  1);
  }

  /* ---- pastilles rouges aux angles des deux lignes ---- */
  if(ART.dots){
    /* deux pastilles par angle, cote a cote sur la bande : une sur la ligne
       horizontale, une sur la verticale, comme sur un vrai plateau */
    /* chaque pastille est centree sur son trait epais ; l'ecart les place
       de part et d'autre de la diagonale, qui vient les effleurer */
    const rr=R(3*K), lig=Math.round(((bo+1)+bi)/2), off=Math.ceil((rr+1)*Math.SQRT2);
    for(const q of [[1,1],[-1,1],[1,-1],[-1,-1]]){
      const cx=q[0]>0?lig:BW-lig, cy=q[1]>0?lig:BW-lig;
      for(const d of [[cx+q[0]*off, cy],[cx, cy+q[1]*off]]){
        pcircle(g,d[0],d[1],rr+1,P.ink);
        pcircle(g,d[0],d[1],rr,felt);
        pcircle(g,d[0],d[1],rr-1,P.red);
      }
    }
  }

  /* ---- crochets fléchés, un par quadrant ---- */
  const hr=R(13*K), hd=R(72*K);
  /* arcs cales pour que la diagonale les coupe pile en leur milieu ;
     bas-droit et haut-gauche restent symetriques par le centre */
  for(const q of [[1,1,125,325],[-1,1,215,415],[1,-1,35,235],[-1,-1,305,505]]){
    const cx=q[0]>0?hd:BW-hd, cy=q[1]>0?hd:BW-hd;
    pring(g,cx,cy,hr,P.ink,q[2],q[3]);
    for(const [ang,sg] of [[q[2],-1],[q[3],1]]){
      const rd=ang*Math.PI/180;
      const px2=cx+Math.cos(rd)*hr, py2=cy+Math.sin(rd)*hr;
      arrow(g,px2,py2,-Math.sin(rd)*sg,Math.cos(rd)*sg,P.ink);
    }
  }

  rosace(g,M,M,R(26*K),P.accent,P.red,felt,P.ink,P.accent);

  /* ---- trous et liseré peint ---- */
  for(const p of POCKETS){
    pring(g,p.x*S,p.y*S,POCK*S+3*K,P.green);
    pring(g,p.x*S,p.y*S,POCK*S+2*K,P.red);
    pcircle(g,p.x*S,p.y*S,POCK*S+K,P.ink);
    pcircle(g,p.x*S,p.y*S,POCK*S,'#171018');
  }

  if(!ART.square){
    const rIn=R(12*K), rOut=R(4*K);   /* angles exterieurs quasi droits */
    roundCut(g,F,F,BW-F,BW-F,rIn,P.woodLo);
    roundCut(g,F-2,F-2,BW-(F-2),BW-(F-2),rIn+2,P.wood);
    roundCut(g,0,0,BW,BW,rOut,P.bg);
  }
  bg=c;
}

/* ===================== rendu ===================== */
function draw(){
  if(!bg) buildBg();
  const g=ctx;
  g.imageSmoothingEnabled=false;
  g.fillStyle=P.bg; g.fillRect(0,0,BUF,TOTH);
  tctx.clearRect(0,0,CSSW,CSSH);

  drawTitre(g);
  drawHud(g);
  /* une page de menu descend sous le plateau : on lui prepare tout le bas */
  if(phase==='menu'){ g.fillStyle=P.bg; g.fillRect(0,CTRL_Y,BUF,TOTH-CTRL_Y); }

  g.save();
  TY=hautPage(); TX=BX;
  g.translate(BX,TY);
  if(rotT!==0){ g.translate(BW/2,BW/2); g.rotate(rotT); g.translate(-BW/2,-BW/2); }
  SHK.x = shakeT>0 ? Math.round((Math.random()-.5)*shakeT*.4) : 0;
  SHK.y = shakeT>0 ? Math.round((Math.random()-.5)*shakeT*.4) : 0;
  if(shakeT>0) g.translate(SHK.x,SHK.y);
  g.drawImage(bg,0,0);

  aimPow=null; pointChoc=null;
  if(phase==='menu') drawMenu(g);
  else if(pause) menuMode(g);
  else {
    let aim=null;
    if(phase==='aim'&&humanTurn()){
      const s3=currentShot();
      aimPow=s3.pow;                       /* la jauge reste juste en permanence */
      /* le trait n'apparait que pendant la visee, jamais pendant le placement */
      if(joyDrag||(s3.pow>0.02&&!trkDrag)) aim=s3;
    }
    if(SMOOTH){
      ecranOuvre();
      let dir=null;
      if(aim) dir=aim;
      else if(aiPlan&&phase==='aim'){ const L=Math.hypot(aiPlan.vx,aiPlan.vy)||1; dir={ux:aiPlan.vx/L,uy:aiPlan.vy/L}; }
      if(dir){
        traitPix(striker.x,striker.y,dir.ux,dir.uy,SR,P.aim,7);
        if(level===0){
          const h2=contact(striker.x,striker.y,dir.ux,dir.uy,SR,null);
          if(h2.d){
            const hx2=striker.x+dir.ux*h2.t, hy2=striker.y+dir.uy*h2.t;
            const ax=h2.d.x-hx2, ay=h2.d.y-hy2, L2=Math.hypot(ax,ay)||1;
            traitPix(h2.d.x,h2.d.y,ax/L2,ay/L2,h2.d.r,'rgba(61,158,114,.8)',9);
          }
        }
      }
      ecranFerme();
    } else {
      if(aim) shotLine(g,aim.ux,aim.uy);
      else if(aiPlan&&phase==='aim'){ const L=Math.hypot(aiPlan.vx,aiPlan.vy)||1; shotLine(g,aiPlan.vx/L,aiPlan.vy/L); }
    }
    for(const o of sinking){
      const f=o.t/o.d;
      const trem = o.rate ? Math.round(Math.sin(o.t*1.7)*2*K*f) : 0;
      const x=(o.x+(o.px-o.x)*(1-f))*S+trem, y=(o.y+(o.py-o.y)*(1-f))*S;
      const rr=Math.max(1,Math.round(o.r*S*(0.35+0.65*f)));
      const body = o.type==='W'?P.wPiece : o.type==='Q'?P.qPiece : o.type==='S'?P.sBody : P.bPiece;
      pcircle(g,x,y,rr,'rgba(0,0,0,.55)');
      if(f>0.25) pcircle(g,x,y,Math.max(0,rr-1),body);
    }
    for(const o of pops){
      const f=1-o.t/o.d, cx=o.x*S, cy=o.y*S;
      if(o.rate){
        /* echec : une croix rouge qui s'ouvre et s'efface, sans onde */
        const br=Math.round(POCK*S*0.55+f*R(11*K)), al=(0.85*(1-f)*(1-f)).toFixed(2);
        for(const d of [[1,1],[1,-1]])
          pline(g,cx-d[0]*br,cy-d[1]*br,cx+d[0]*br,cy+d[1]*br,'rgba(200,54,46,'+al+')');
        if(f<0.45) pring(g,cx,cy,Math.round(POCK*S-f*R(10*K)),'rgba(200,54,46,'+(0.5*(1-f/0.45)).toFixed(2)+')');
      } else {
        const col='rgba(61,158,114,';
        pring(g,cx,cy,Math.round(POCK*S+f*R(14*K)),col+(0.55*(1-f)).toFixed(2)+')');
        if(f>0.2) pring(g,cx,cy,Math.round(POCK*S+(f-0.2)*R(20*K)),col+(0.28*(1-f)).toFixed(2)+')');
      }
    }
    if(SMOOTH){
      ecranOuvre();
      for(const d of discs) if(d.alive) discPix(d);
      if(striker.alive) discPix(striker);
      ecranFerme();
    } else {
      for(const d of discs) if(d.alive) disc(g,d);
      if(striker.alive) disc(g,striker);
    }
    if(pointChoc){                       /* bien visible quel que soit le sens du tir */
      const X=Math.round(pointChoc.x*S), Y=Math.round(pointChoc.y*S);
      pcircle(g,X,Y,R(2*K),'rgba(10,8,6,.60)');
      pcircle(g,X,Y,R(2*K)-1,couleurCote(turn));
    }
  }
  g.restore();
  TY=0; TX=0;

  if(phase!=='menu'){ drawCtrl(g); drawButtons(g); }
  if(pause){                       /* la fenetre flotte, tout le reste s'efface */
    voile(g,0,HUD_Y,BUF,HUD_H);            /* l'en-tete : les scores s'eteignent aussi */
    voile(g,0,CTRL_Y,BUF,TOTH-CTRL_Y);     /* la zone de controle et la barre du bas */
  }
  if(aimPow!==null) powerBar(g,aimPow);
  if(phase==='over') drawBanner(g);
  else if(!pause) drawNote(g);
}

/* Le mot de fin de tir, pose en haut du plateau : hors de la zone de jeu,
   et hors du repere tourne, donc toujours lisible a l'endroit. */
function drawNote(g){
  const n=notes[0];
  if(!n||phase==='menu') return;
  const fam='j15';
  /* les noms allongent les mots : on descend d'un cran plutot que de deborder */
  let taille=R(11*K), w=Math.ceil(jw(n.txt,taille,fam))+R(18*K);
  if(w>BUF-R(6*K)){ taille=R(9*K); w=Math.ceil(jw(n.txt,taille,fam))+R(14*K); }
  const h=R(19*K);
  const x=Math.round((BUF-w)/2), y=BOARD_Y+R(14*K);
  const f=Math.min(1,n.t/14);                    /* fondu sur la fin */
  const col = couleurCote(n.cote);
  g.globalAlpha=f; tctx.globalAlpha=f;
  plate(g,x,y,w,h,P.panel);
  jtext(n.txt,BUF/2,jmid(y,h,taille,fam),col,taille,fam,'c');
  g.globalAlpha=1; tctx.globalAlpha=1;
}

/* Le nom du jeu, tout en haut, en toutes circonstances : partie, menu, fenetre
   de reglages, ecran de fin. Il ne clignote pas d'un ecran a l'autre et aucun
   voile ne le touche — c'est le seul element qui n'appartient a aucune page. */
function drawTitre(g){
  g.fillStyle=P.bg; g.fillRect(0,0,BUF,TITRE_H);
  jtext('KAROM',BUF/2,jmid(0,TITRE_H,R(11*K),'j25'),P.accent,R(11*K),'j25','c');
}

/* Trois cases d'en-tete, dont le contenu depend du mode */
function hudCases(){
  const adv = mode==='solo'?'CPU':'JOUEUR 2';
  const jetons = discs.filter(d=>d.alive&&d.type!=='Q').length;
  if(cfg.hud==='vider')
    return {g:{lab:'TIRS',  who:'RESTANTS', val:Math.max(0,(cfg.tirs||0)-tirsFaits), col:cfg.teinte, cote:null},
            d:{lab:'JETONS',who:'EN JEU',   val:jetons, col:P.wPiece, cote:null}, mil:'etoiles'};
  if(cfg.hud==='solo')
    return {g:{lab:'SCORE', who:'JOUEUR 1', val:score.W, col:cfg.teinte, cote:'W'},
            d:{lab:cfg.temps?'JETONS':'TIRS', who:cfg.temps?'EN JEU':'RESTANTS',
               val:cfg.temps?jetons:Math.max(0,(cfg.tirs||0)-tirsFaits), col:P.wPiece, cote:null},
            mil: cfg.temps?'temps':'combo'};
  if(cfg.hud==='points')
    /* tout le monde joue tous les jetons : pas de camp, donc pas de pastille de couleur */
    return {g:{lab:'JOUEUR 1',who:'POINTS', val:score.W, col:cfg.teinte, cote:'W'},
            d:{lab:adv,       who:'POINTS', val:score.B, col:cfg.teinte, cote:'B'}, mil:'cible'};
  /* le jeton dit deja la couleur du camp : la case n'affiche que le joueur */
  return {g:{lab:'JOUEUR 1', who:null, val:remaining('W'), col:P.wPiece, cote:'W'},
          d:{lab:adv,        who:null, val:remaining('B'), col:P.bPiece, cote:'B'}, mil:'reine'};
}
function mmss(ms){
  const t=Math.max(0,Math.ceil(ms/1000));
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
}
function drawHud(g){
  /* mx : marge laterale, y : hauteur du haut des plaques, h : leur epaisseur.
     iy replace le contenu au milieu de la plaque quand celle-ci s'epaissit. */
  const mx=R(2*K), y=HUD_Y+R(5*K), h=HUD_H-R(8*K), pad=R(6*K);
  const iy=y+Math.floor((h-R(28*K))/2);
  /* Hors partie, l'en-tete n'a rien a dire : ni score, ni camp, ni reine. On
     ne pose donc aucune plaque — le nom du jeu suffit tout en haut, et le
     dessous reste vide jusqu'au menu. */
  if(phase==='menu') return;
  const H2=hudCases(), half=R(108*K);
  const cases=[{c:H2.g,x:mx,t:'W'},{c:H2.d,x:BUF-half-mx,t:'B'}];
  /* Une seule taille de nom pour les deux cases. Mesuree une fois sur le nom
     le plus large : sinon JOUEUR 2, d'un cheveu plus long que JOUEUR 1,
     descendait d'un cran tout seul et l'en-tete perdait sa symetrie. La
     quantification de la police varie avec la densite d'ecran, donc le calcul
     doit rester commun aux deux cotes. */
  let capNom=R(10*K);
  if(!H2.g.who){
    const xNom0=pad+2*R(4*K)+R(5*K);
    /* la pastille du compte se taille avant le nom : elle a une largeur fixe,
       le nom prend ce qui reste */
    const dispo=half-R(4*K)-2*R(8*K)-R(5*K)-xNom0;
    /* On garde celle qui rend le plus grand, pas celle qu'on demande le plus
       grand : la police se cale sur la grille de l'ecran, si bien qu'un corps
       demande plus haut peut s'afficher plus bas. Prendre le premier candidat
       qui passe donnerait un resultat au petit bonheur. */
    /* le cut fin de la Jersey : sur un ecran a trois fois la densite, le cut
       large n'offre que 7 ou 15 px, rien entre les deux */
    const tailles=[R(9*K),R(8*K),R(7*K),R(6*K)];
    capNom=tailles[tailles.length-1];
    let mieux=-1;
    for(const t of tailles){
      if(cases.every(s2=>jw(s2.c.lab,t,'j15')<=dispo)){
        const rendu=jcaps(t,'j15');
        if(rendu>mieux){ mieux=rendu; capNom=t; }
      }
    }
  }
  for(const s2 of cases){
    const on = s2.c.cote ? (turn===s2.c.cote&&phase!=='over') : false;
    plate(g,s2.x,y,half,h,on?couleurCote(s2.c.cote):P.panel);
    const fg=on?P.edge:P.pale, sub2=on?'rgba(10,8,6,.60)':P.mute;
    if(!s2.c.who){
      /* Une seule ligne — le jeton, le nom du joueur, son compte. Rien a caser
         dessous, donc tout monte d'un cran et remplit la case. */
      const cy2=y+Math.floor(h/2), rj=R(4*K);
      const dcx2=s2.x+pad+rj;
      pcircle(g,dcx2,cy2,rj,on?P.edge:P.panel2);
      pcircle(g,dcx2,cy2,rj-1,s2.c.col);
      const nb2=String(s2.c.val), sp3=s2.c.cote?scorePop[s2.c.cote]:0;
      const cap2=sp3>12?R(14*K):R(11*K), dy3=sp3>0?-R(2*K):0;
      /* le nom dans la police des titres, et la place du compte est reservee
         d'abord : le nom se contente de ce qui reste, quitte a descendre d'un
         cran, plutot que d'aller toucher le chiffre */
      jtext(s2.c.lab,dcx2+rj+R(5*K),jmid(y,h,capNom,'j15'),fg,capNom,'j15');
      /* Le compte dans sa pastille : colle au nom il se lisait comme sa suite.
         La pastille est l'inverse exact de sa plaque — elle prend la couleur de
         l'encre, le chiffre celle du fond. Elle se detache donc aussi bien sur
         la plaque peinte du joueur actif que sur la plaque sombre de l'autre. */
      const rSc=R(8*K), cxSc=s2.x+half-R(4*K)-rSc;
      const encre = on ? P.edge : couleurCote(s2.c.cote);
      const col2  = on ? couleurCote(s2.c.cote) : P.panel;
      pcircle(g,cxSc,cy2,rSc,P.edge);
      pcircle(g,cxSc,cy2,rSc-1,encre);
      jtext(nb2,cxSc,jmid(y,h,cap2,'j15')+dy3,col2,cap2,'j15','c');
      if(sp3>0){
        const rr2=rSc+Math.round((20-sp3)*0.6*K);
        pring(g,cxSc,cy2,rr2,on?'rgba(10,8,6,.35)':'rgba(237,228,210,.30)');
      }
      continue;
    }
    const dcx=s2.x+pad+R(4*K), dcy=iy+R(8*K);
    pcircle(g,dcx,dcy,R(4*K),on?P.edge:P.panel2);
    pcircle(g,dcx,dcy,R(4*K)-1,s2.c.col);
    stext(g,s2.c.lab,s2.x+pad+R(12*K),iy+R(4*K),fg);
    stext(g,s2.c.who,s2.x+pad,iy+R(18*K),sub2);
    const nb=String(s2.c.val), sp=s2.c.cote?scorePop[s2.c.cote]:0;
    const cap=sp>12?R(17*K):R(14*K), dy2=sp>0?-R(2*K):0;
    const col=sp>0?(on?P.edge:couleurCote(s2.c.cote)):fg;
    jtext(nb,s2.x+half-pad,iy+R(9*K)+dy2,col,cap,'j15','r');
    if(sp>0){
      const rr=R(10*K)+Math.round((20-sp)*0.8*K);
      pring(g,s2.x+half-pad-R(6*K),iy+R(14*K),rr,on?'rgba(10,8,6,.35)':'rgba(237,228,210,.30)');
    }
  }
  /* case centrale : la regle qui compte dans ce mode */
  const qx=half+R(4*K), qw=BUF-2*qx, qc=qx+qw/2;
  if(H2.mil==='reine'){
    plate(g,qx,y,qw,h,queenState.owner?P.panel2:P.panel);
    const q=discs.find(d=>d.type==='Q');
    pcircle(g,qc,iy+R(8*K),R(4*K),P.qEdge);
    pcircle(g,qc,iy+R(8*K),R(4*K)-1,(q&&q.alive)?P.qPiece:P.panel2);
    let qt='--';
    if(queenState.owner) qt = queenState.owner==='W'?'CLA':(mode==='solo'?'ORD':'FON');
    else if(queenState.pendingBy) qt='COUVRE';
    stextC(g,qt,qc,iy+R(16*K),queenState.owner?couleurCote(queenState.owner):P.mute);
  } else if(H2.mil==='etoiles'){
    plate(g,qx,y,qw,h,P.panel);
    const e=cfg.etoiles||[0,0,0];
    let acquis=0;
    if(tirsFaits<=e[0]) acquis=3; else if(tirsFaits<=e[1]) acquis=2; else if(tirsFaits<=e[2]) acquis=1;
    for(let i=0;i<3;i++){
      const ex=qc+(i-1)*R(9*K);
      pcircle(g,ex,iy+R(8*K),R(3*K),i<acquis?cfg.teinte:P.panel2);
    }
    stextC(g,'ETOILES',qc,iy+R(16*K),P.mute);
  } else if(H2.mil==='temps'){
    plate(g,qx,y,qw,h,tempsMs<15000?P.panel2:P.panel);
    jtext(mmss(tempsMs),qc,iy+R(3*K),tempsMs<15000?cfg.teinte:P.pale,R(11*K),'j15','c');
    stextC(g,'TEMPS',qc,iy+R(16*K),P.mute);
  } else if(H2.mil==='combo'){
    plate(g,qx,y,qw,h,P.panel);
    const mult = cfg.combo ? cfg.combo[Math.min(Math.max(comboDernier,1),cfg.combo.length)-1] : 1;
    jtext('X'+mult,qc,iy+R(3*K),comboDernier>1?cfg.teinte:P.mute,R(11*K),'j15','c');
    stextC(g,'COMBO',qc,iy+R(16*K),P.mute);
  } else {
    plate(g,qx,y,qw,h,P.panel);
    jtext(String(cfg.cible||'--'),qc,iy+R(3*K),P.pale,R(11*K),'j15','c');
    stextC(g,'CIBLE',qc,iy+R(16*K),P.mute);
  }
}


const RULES=[
 {t:'BUT DU JEU', l:'EMPOCHE TES 9 JETONS AVANT L ADVERSAIRE. LES CLAIRS COMMENCENT.'},
 {t:'LE COUP',    l:'PLACE LE PALET AVEC LA REGLETTE PLACE. VISE AVEC LE JETON DU BAS. TROIS MODES DE VISEE AU CHOIX DANS LES OPTIONS. SI TU EMPOCHES UN DES TIENS, TU REJOUES.'},
 {t:'LA REINE',   l:'LE JETON ROUGE EST LA REINE. APRES L AVOIR EMPOCHEE TU DOIS LA COUVRIR EN EMPOCHANT UN DES TIENS, SINON ELLE RETOURNE AU CENTRE.'},
 {t:'LA FAUTE',   l:'SI LE PALET TOMBE DANS UN TROU, UN DE TES JETONS REVIENT SUR LE PLATEAU ET TU PERDS LA MAIN.'}
];
function wrap(t,maxw){
  const words=norm(t,GS).split(' '); const out=[]; let ln='';
  for(const w of words){ const test=ln?ln+' '+w:w; if(sw(test)>maxw&&ln){ out.push(ln); ln=w; } else ln=test; }
  if(ln) out.push(ln);
  return out;
}
function tag(g,t,cx,y){
  const w=sw(t)+R(8*K), x=Math.round(cx-w/2), h=GH+R(4*K);
  g.fillStyle=P.edge;  g.fillRect(x,y-R(2*K),w,h);
  g.fillStyle=P.panel; g.fillRect(x+1,y-R(2*K)+1,w-2,h-2);
  stextC(g,t,cx,y,P.pale);
}
/* Voile d'arriere-plan : assombrissement franc, puis trame une ligne sur deux.
   Le fond perd sa lisibilite sans disparaitre. */
function voile(g,x,y,w,h){
  g.fillStyle='rgba(10,8,6,.72)'; g.fillRect(x,y,w,h);
  g.fillStyle='rgba(10,8,6,.45)';
  for(let j=y+1;j<y+h;j+=2) g.fillRect(x,j,w,1);
  /* Le texte vit sur son propre calque, pose par-dessus : un rectangle sombre
     sur le calque du dessous ne l'atteint pas. On l'efface donc en partie, ce
     qui le fait fondre vers le fond deja assombri. */
  tctx.save();
  tctx.globalCompositeOperation='destination-out';
  tctx.fillStyle='rgba(0,0,0,.80)';
  /* TX et TY : le voile est parfois pose dans le repere du plateau, le texte
     toujours dans celui de l'ecran — comme dans jtext, on rattrape l'ecart */
  tctx.fillRect((x+TX)*KTX,(y+TY)*KTX,w*KTX,h*KTX);
  tctx.restore();
}
function hair(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,1); g.fillRect(x,y+h-1,w,1); g.fillRect(x,y,1,h); g.fillRect(x+w-1,y,1,h); }

  stextC(g,'PAGE '+(rulePage+1)+' / '+RULES.length,BW/2,u.prev.y-R(11*K),P.mute);
  for(const [z,lab,id] of [[u.prev,'<','fen-prev'],[u.back,'RETOUR','fen-back'],[u.next,'>','fen-next']]){
    const hit=press.id===id&&press.t>0, dy=hit?R(2*K):0;
    g.fillStyle=hit?P.accent:P.bg; g.fillRect(z.x,z.y+dy,z.w,z.h);
    hair(g,z.x,z.y+dy,z.w,z.h,hit?P.accent:P.panel2);
    jtext(lab,z.x+z.w/2,jmid(z.y+dy,z.h,R(8*K),'j25'),hit?P.edge:P.pale,R(8*K),'j25','c');
  }
}

/* ---------- zone de contrôle ---------- */
function drawCtrl(g){
  g.fillStyle=P.bg; g.fillRect(0,CTRL_Y,BUF,CTRL_H);
  const live = phase==='aim' && humanTurn() && bannerT===0 && rotT===rotGoal && !pause;
  /* le pave d'abord : la reglette et le jeton sont deux etages du meme panneau */
  const marge=R(12*K), LP=BUF-2*marge, px0=marge, py0=PAD_Y;
  g.fillStyle=P.panel; g.fillRect(px0,py0,LP,PAD_H);
  hair(g,px0,py0,LP,PAD_H,P.panel2);
  /* réglette de placement, en bandeau haut */
  const tw2=TRK.x1-TRK.x0, ty=TRK.y;
  g.fillStyle=P.bg; g.fillRect(TRK.x0,ty-R(2*K),tw2,R(4*K));
  hair(g,TRK.x0-R(2*K),ty-R(4*K),tw2+R(4*K),R(8*K),P.panel2);
  let t=(placeX-BASE_X0)/(BASE_X1-BASE_X0);
  if(flipped()) t=1-t;
  const kxf=TRK.x0+Math.max(0,Math.min(1,t))*tw2, kx=Math.round(kxf);
  /* deux petites fleches de part et d'autre : le curseur se deplace */
  const fl=live?P.mute:P.panel2, ec=R(11*K);
  if(kx-ec>TRK.x0+R(3*K)) arrow(g,kx-ec,ty,-1,0,fl);
  if(kx+ec<TRK.x1-R(3*K)) arrow(g,kx+ec,ty, 1,0,fl);
  if(live&&!placeTouche){          /* a activer : le curseur respire */
    const br=R(10*K)+Math.round(Math.sin(pulse/13)*2*K);
    pring(g,kx,ty,br,'rgba(61,158,114,.45)');
    pring(g,kx,ty,br-1,'rgba(61,158,114,.18)');
  }
  if(SMOOTH){
    ecranOuvre();
    pastillePix(kxf,ty,R(6*K),P.edge);
    pastillePix(kxf,ty,R(6*K)-1,live?P.sBody:P.panel2);
    pastillePix(kxf,ty,R(3*K),P.sRed,Math.max(0,R(3*K)-1));
    ecranFerme();
  } else {
    pcircle(g,kx,ty,R(6*K),P.edge);
    pcircle(g,kx,ty,R(6*K)-1,live?P.sBody:P.panel2);
    pring(g,kx,ty,R(3*K),P.sRed);
  }
  /* trait de separation entre les deux etages */
  g.fillStyle=P.panel2; g.fillRect(px0+R(8*K),PWR.y,LP-R(16*K),1);
  /* manette : meme langage que les panneaux et les barres du jeu */
  const a=currentShot();
  const jbas=py0+PAD_H;
  /* deux axes de reperage, ni plus : le vertical s'arrete au bandeau */
  g.fillStyle=P.panel2;
  g.fillRect(JOY.cx,PWR.y+R(8*K),1,jbas-PWR.y-R(16*K));
  g.fillRect(px0+R(9*K),JOY.cy,LP-R(18*K),1);
  /* crans de puissance sur les deux bords, comme la barre du dessus */
  const jm=jetonManette(), jr=jm.r, span=jm.span;
  for(const f of [0,0.25,0.5,0.75,1]){
    const yy=Math.round(JOY.cy-span+2*span*f), lg=(f===0||f===1)?R(7*K):R(4*K);
    g.fillStyle=P.mute;
    g.fillRect(px0+R(4*K),yy,lg,1);
    g.fillRect(px0+LP-R(4*K)-lg,yy,lg,1);
  }
  if(a&&a.pow>0.02){
    /* dans le repere du joueur, pas celui du plateau : le pave ne pivote pas */
    const vx=Math.cos(aimAng), vy=Math.sin(aimAng);
    const hv=(vy<0 ? JOY.cy-PWR.y : jbas-JOY.cy)-R(8*K);
    const lim=Math.min((LP/2-R(8*K))/Math.max(0.001,Math.abs(vx)),
                       hv/Math.max(0.001,Math.abs(vy)));
    for(let d=R(22*K); d<lim; d+=R(5*K)){
      g.fillStyle=couleurCote(turn);
      g.fillRect(Math.round(JOY.cx+vx*d),Math.round(JOY.cy+vy*d),1,1);
    }
    arrow(g,Math.round(JOY.cx+vx*lim),Math.round(JOY.cy+vy*lim),vx,vy,couleurCote(turn));
  }
  const jxf=jm.x, jyf=jm.y;
  if(SMOOTH){
    ecranOuvre();
    pastillePix(jxf+K,jyf+2*K,jr,'rgba(0,0,0,.20)');
    pastillePix(jxf,jyf,jr,P.sEdge);
    pastillePix(jxf,jyf,jr-1,live?P.sBody:'#6B655C');
    pastillePix(jxf,jyf,Math.max(1,jr-R(4*K)),P.sRed,Math.max(0,jr-R(4*K)-1));
    pastillePix(jxf,jyf,R(2*K),P.sRed);
    ecranFerme();
  } else {
    const jx=Math.round(jxf), jy=Math.round(jyf);
    if(live&&placeTouche){         /* le placement est fait : au tour du jeton */
      const br=jr+R(6*K)+Math.round(Math.sin(pulse/13)*2*K);
      pring(g,jx,jy,br,'rgba(61,158,114,.45)');
      pring(g,jx,jy,br-1,'rgba(61,158,114,.18)');
    }
    pcircle(g,jx+K,jy+2*K,jr+1,'rgba(0,0,0,.10)');
    pcircle(g,jx+K,jy+2*K,jr,'rgba(0,0,0,.20)');
    pcircle(g,jx,jy,jr,P.sEdge);
    pcircle(g,jx,jy,jr-1,live?P.sBody:'#6B655C');
    pring(g,jx,jy,jr-R(4*K),P.sRed);
    pcircle(g,jx,jy,R(2*K),P.sRed);
  }
}


/* Trois petits logos dessines au pixel, dans le meme esprit que le reste */
function icone(g,nom,cx,cy,col,taille){
  g.fillStyle=col;
  const T=taille||R(11*K), u=Math.max(1,Math.round(T/8));
  if(nom==='menu'){
    for(let i=-1;i<=1;i++) g.fillRect(cx-Math.floor(T/2),cy+i*Math.round(T*0.36)-Math.floor(u/2),T,u);
  } else if(nom==='pause'){
    const e=Math.round(T*0.26);
    g.fillRect(cx-e-u,cy-Math.floor(T/2),u+1,T);
    g.fillRect(cx+e,  cy-Math.floor(T/2),u+1,T);
  } else if(nom==='rejouer'){
    const r=Math.max(2,Math.round(T*0.55));
    for(let a=30;a<=330;a+=6){
      const rd=a*Math.PI/180;
      g.fillRect(Math.round(cx+Math.cos(rd)*r),Math.round(cy-Math.sin(rd)*r),u,u);
    }
    const rd=30*Math.PI/180;
    arrow(g,Math.round(cx+Math.cos(rd)*r),Math.round(cy-Math.sin(rd)*r),
          Math.cos(rd+Math.PI/2),-Math.sin(rd+Math.PI/2),col);
  } else if(nom==='reprendre'){
    const n=Math.max(2,Math.round(T*0.62));
    for(let i=0;i<n;i++){
      const hh=Math.round(T/2*(1-i/n));
      g.fillRect(cx-Math.round(T*0.28)+i,cy-hh,1,hh*2+1);
    }
  }
}
function drawButtons(g){
  g.fillStyle=P.bg; g.fillRect(0,BTN_Y,BUF,BTN_H);
  for(const b of btnRects()){
    const hit=press.id===b.id&&press.t>0, dy=hit?R(2*K):0;
    if(b.id==='start'){                     /* le bouton de lancement porte le dessin du palet */
      g.fillStyle=P.sEdge;              g.fillRect(b.x,b.y+dy,b.w,b.h);
      g.fillStyle=hit?P.accent:P.sBody; g.fillRect(b.x+1,b.y+dy+1,b.w-2,b.h-2);
      const cxi=b.x+R(14*K), cyi=b.y+dy+Math.floor(b.h/2);
      pring(g,cxi,cyi,R(8*K),P.sRed);
      pcircle(g,cxi,cyi,R(2*K),P.sRed);
      jtext(b.l,b.x+R(26*K)+(b.w-R(26*K))/2,jmid(b.y+dy,b.h,R(11*K),'j15'),hit?P.edge:P.sRed,R(11*K),'j15','c');
    } else {
      g.fillStyle=hit?P.accent:P.panel; g.fillRect(b.x,b.y+dy,b.w,b.h);
      hair(g,b.x,b.y+dy,b.w,b.h,hit?P.accent:P.panel2);
      const col=hit?P.edge:P.pale, cyb=b.y+dy+Math.floor(b.h/2);
      if(b.ico&&!b.l) icone(g,b.ico,b.x+Math.floor(b.w/2),cyb,col);
      else if(b.ico){
        /* le logo en petit, colle a gauche du mot, l'ensemble centre */
        /* Jersey 25 : sa grille plus fine permet un cran intermediaire
           entre 10 et 5 px de capitale, la ou Jersey 15 n'a rien */
        const lw=jw(b.l,R(8*K),'j25'), ew=R(10*K)+lw, x0=b.x+(b.w-ew)/2;
        icone(g,b.ico,Math.round(x0+R(3*K)),cyb,col,R(6*K));
        jtext(b.l,x0+R(10*K),jmid(b.y+dy,b.h,R(8*K),'j25'),col,R(8*K),'j25');
      } else jtext(b.l,b.x+b.w/2,jmid(b.y+dy,b.h,R(11*K),'j15'),col,R(11*K),'j15','c');
    }
  }
}

/* Le bandeau de fin porte tout : le mot et les deux boutons. Il est donc
   assez epais pour les loger, avec de l'air autour. */
function bandeauUI(){
  const bh=R(22*K), gap=R(8*K), bw=R(80*K);
  const hTxt=R(26*K), marge=R(13*K), entre=R(11*K);
  const h=marge+hTxt+entre+bh+marge;
  const yc=BOARD_Y+Math.round(BW/2)-Math.round(h/2);
  const yTxt=yc+marge, by=yTxt+hTxt+entre;
  return {h,yc,yTxt,hTxt,by,
    menu :{x:Math.round(BUF/2-bw-gap/2), y:by, w:bw, h:bh},
    again:{x:Math.round(BUF/2+gap/2),    y:by, w:bw, h:bh}};
}
function drawBanner(g){
  const u=bandeauUI();
  if(SMOOTH) tctx.clearRect(0,(u.yc-3)*KTX,BUF*KTX,(u.h+6)*KTX);
  /* le bandeau traverse tout l'ecran */
  g.fillStyle=P.edge;   g.fillRect(0,u.yc-3,BUF,u.h+6);
  g.fillStyle=P.panel2; g.fillRect(0,u.yc,BUF,u.h);
  g.fillStyle=P.accent; g.fillRect(0,u.yc,BUF,1); g.fillRect(0,u.yc+u.h-1,BUF,1);
  jtext(bannerTxt,BUF/2,jmid(u.yTxt,u.hTxt,R(18*K),'j25'),P.accent,R(18*K),'j25','c');
  for(const [b,lab,id] of [[u.menu,'MENU','fin-menu'],[u.again,'REJOUER','fin-again']]){
    const hit=press.id===id&&press.t>0, dy=hit?R(2*K):0;
    g.fillStyle=hit?P.accent:P.panel; g.fillRect(b.x,b.y+dy,b.w,b.h);
    hair(g,b.x,b.y+dy,b.w,b.h,hit?P.accent:P.panel2);
    jtext(lab,b.x+b.w/2,jmid(b.y+dy,b.h,R(8*K),'j25'),hit?P.edge:P.pale,R(8*K),'j25','c');
  }
}

/* Entre deux tours c'est le plateau qui pivote, pas la lampe. Un jeton etant
   rond, sa rotation ne se voit pas — sauf a son ombre et a son eclat, qui
   partiraient du mauvais cote. On contre-tourne donc leur decalage : a
   l'ecran ils gardent leur place, quelle que soit l'orientation du plateau. */
function versLumiere(dx,dy){
  if(!rotT) return {x:dx,y:dy};
  const c=Math.cos(-rotT), s=Math.sin(-rotT);
  return {x:dx*c-dy*s, y:dx*s+dy*c};
}
function disc(g,d){
  const cx=d.x*S, cy=d.y*S, r=Math.max(2,Math.round(d.r*S));
  let body,edge;
  if(d.type==='S'){ body=P.sBody; edge=P.sEdge; }
  else if(d.type==='W'){ body=P.wPiece; edge=P.wEdge; }
  else if(d.type==='Q'){ body=P.qPiece; edge=P.qEdge; }
  else { body=P.bPiece; edge=P.bEdge; }
  const om=versLumiere(K,2*K);
  pcircle(g,cx+om.x,cy+om.y,r+1,'rgba(24,14,4,.10)');
  pcircle(g,cx+om.x,cy+om.y,r,'rgba(24,14,4,.22)');
  pcircle(g,cx,cy,r,edge);
  pcircle(g,cx,cy,r-1,body);
  if(d.type==='S'){ pring(g,cx,cy,Math.max(1,r-2),P.sRed); g.fillStyle=P.sRed; g.fillRect(Math.round(cx),Math.round(cy),1,1); }
  else {
    g.fillStyle = d.type==='B' ? 'rgba(255,255,255,.22)' : 'rgba(255,255,255,.75)';
    const h1=versLumiere(0,-r+1), h2=versLumiere(-r+1,0);
    g.fillRect(Math.round(cx+h1.x)-1,Math.round(cy+h1.y),2,1);
    g.fillRect(Math.round(cx+h2.x),Math.round(cy+h2.y)-1,1,1);
  }
}

function shotLine(g,ux,uy){
  const t=shotLineFrom(g,striker.x,striker.y,ux,uy,SR);
  /* aide au niveau facile : ou repart le jeton percute */
  if(level===0 && t && t.d){
    const dx=t.d.x-t.cx, dy=t.d.y-t.cy, L=Math.hypot(dx,dy)||1;
    ligneRebond(g,t.d,dx/L,dy/L);
  }
}
/* distance exacte jusqu'au contact : intersection du rayon avec chaque jeton,
   puis avec les bandes ; evite l'approximation d'un pas d'echantillonnage */
function contact(ox,oy,ux,uy,rad,ignore){
  let best=null;
  for(const d of discs){
    if(!d.alive||d===ignore) continue;
    const RR=d.r+rad, fx=ox-d.x, fy=oy-d.y;
    const b=2*(fx*ux+fy*uy), c=fx*fx+fy*fy-RR*RR, det=b*b-4*c;
    if(det<0) continue;
    const r2=Math.sqrt(det);
    let t=(-b-r2)/2; if(t<0.001) t=(-b+r2)/2;
    if(t<0.001) continue;
    if(!best||t<best.t) best={t,d};
  }
  let tm=1e9;
  const bord=(v,dv,lim)=>{ if(Math.abs(dv)>1e-6){ const t=(lim-v)/dv; if(t>0.001&&t<tm) tm=t; } };
  bord(ox,ux,MINX+rad); bord(ox,ux,MAXX-rad);
  bord(oy,uy,MINY+rad); bord(oy,uy,MAXY-rad);
  if(best && best.t<tm) return best;
  return {t:Math.min(tm,1400), d:null};
}
function shotLineFrom(g,ox,oy,ux,uy,rad){
  const h=contact(ox,oy,ux,uy,rad,null), end=h.t;
  const t0=rad+5;
  for(let t=t0;t<end;t+=1.6){
    if(Math.round((t-t0)/1.6)%5>1) continue;
    const X=Math.round((ox+ux*t)*S), Y=Math.round((oy+uy*t)*S);
    /* le pointille reste dans son brun sombre, dessine pour le tapis : c'est
       le point de choc au bout qui porte la couleur du camp */
    g.fillStyle='rgba(255,255,255,.4)'; g.fillRect(X+1,Y+1,1,1);
    g.fillStyle=P.aim; g.fillRect(X,Y,1,1);
  }
  if(h.d){
    /* l'endroit du choc est garde de cote : il sera trace par-dessus les jetons */
    const cx=ox+ux*end, cy=oy+uy*end;
    pointChoc={ x:cx+(h.d.x-cx)*rad/(rad+h.d.r), y:cy+(h.d.y-cy)*rad/(rad+h.d.r) };
    return {d:h.d, cx, cy};
  }
  arrow(g,Math.round((ox+ux*end)*S),Math.round((oy+uy*end)*S),ux,uy,couleurCote(turn));
  return {d:null, cx:0, cy:0};
}
/* le jeton percute repart le long de la ligne des centres */
function ligneRebond(g,d,ux,uy){
  let end=1400;
  for(let t=d.r+4;t<1400;t+=5){
    const x=d.x+ux*t, y=d.y+uy*t;
    if(x<MINX+d.r||x>MAXX-d.r||y<MINY+d.r||y>MAXY-d.r){ end=t; break; }
    let stop=false;
    for(const o of discs){ if(!o.alive||o===d) continue; if(Math.hypot(o.x-x,o.y-y)<o.r+d.r){ end=t; stop=true; break; } }
    for(const p of POCKETS) if(Math.hypot(p.x-x,p.y-y)<POCK){ end=t; stop=true; break; }
    if(stop) break;
  }
  const t0=d.r+3;
  for(let t=t0;t<end;t+=2.2){
    if(Math.round((t-t0)/2.2)%4>0) continue;
    g.fillStyle='rgba(61,158,114,.75)';
    g.fillRect(Math.round((d.x+ux*t)*S),Math.round((d.y+uy*t)*S),1,1);
  }
  arrow(g,Math.round((d.x+ux*end)*S),Math.round((d.y+uy*end)*S),ux,uy,'rgba(61,158,114,.85)');
}

function powCol(f){ const r=rampeCote(turn); return f<0.25?r[0] : f<0.50?r[1] : f<0.75?r[2] : r[3]; }
function powerBar(g,pow){
  /* fine, et posee au milieu de la bande de bois du bord droit */
  const bwd=R(5*K), x=Math.round(BX+BW-R(FRAME*S)/2-bwd/2);
  const y0=BOARD_Y+R(18*K), y1=BOARD_Y+BW-R(18*K), h=y1-y0;
  g.fillStyle=P.edge;   g.fillRect(x-2,y0-2,bwd+4,h+4);
  g.fillStyle=P.panel2; g.fillRect(x,y0,bwd,h);
  const n=24, sg=Math.floor(h/n);
  for(let i=0;i<n;i++){
    const f=i/n, yy=y1-(i+1)*sg;
    g.fillStyle=(f<pow)?powCol(f):'rgba(0,0,0,.32)';
    g.fillRect(x+1,yy+1,bwd-2,sg-2);
  }
  const my=Math.round(y1-pow*h);
  g.fillStyle=P.pale;
  /* le repere se colle a la barre pour rester lui aussi dans le bois */
  for(let i=0;i<R(3*K);i++) g.fillRect(x-1-i,my-i,1,i*2+1);
}
/* ===================== HUD helpers ===================== */
function banner(t){ bannerTxt=t; bannerT=58; }

/* ===================== boucle ===================== */
let horloge=0;
function loop(t){
  const now = t||0;
  if(cfg.temps && phase!=='menu' && phase!=='over' && !pause){   /* l'horloge s'arrete en pause */
    if(horloge) tempsMs -= (now-horloge);
    horloge=now;
    if(tempsMs<=0){ tempsMs=0; finish(score.W>=score.B?'W':'B'); }
  } else horloge=now;
  blink=(blink+1)%44; pulse++;

  if(press.t>0) press.t--;
  if(chocCd>0) chocCd--;
  if(bandeCd>0) bandeCd--;
  if(scorePop.W>0) scorePop.W--;
  if(scorePop.B>0) scorePop.B--;
  if(sinking.length) sinking=sinking.filter(o=>--o.t>0);
  if(pops.length)    pops=pops.filter(o=>--o.t>0);
  if(bannerT>0&&bannerT<1e8) bannerT--;
  if(notes.length && --notes[0].t<=0) notes.shift();
  if(Math.abs(rotT-rotGoal)>0.001){
    const pas=Math.PI/26;
    rotT += Math.sign(rotGoal-rotT)*Math.min(pas,Math.abs(rotGoal-rotT));
  } else rotT=rotGoal;
  if(shakeT>0) shakeT--;
  if(phase==='menu'){ /* rien a simuler */ }
  else if(phase==='roll' && !pause){ if(!step()) endStroke(); }
  else if(phase==='aim'&&mode==='solo'&&turn===AI&&bannerT===0&&!pause){
    if(!aiPlan){ aiPlan=planShot(); placeStriker(aiPlan.sx); aiWait=34; }
    else if(--aiWait<=0){ striker.vx=aiPlan.vx; striker.vy=aiPlan.vy; sndTir(Math.hypot(aiPlan.vx,aiPlan.vy)/MAXPOW); aiPlan=null; phase='roll'; }
  }
  draw();
  requestAnimationFrame(loop);
}

/* ===================== events ===================== */
cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); sndCtx(); onDown(e); });
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',()=>{ joyDrag=null; trkDrag=false; });
document.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,120));
if(window.visualViewport) window.visualViewport.addEventListener('resize',layout);

chargerSauvegarde();
applyTheme();
openMenu();
layout();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
requestAnimationFrame(loop);
})();
